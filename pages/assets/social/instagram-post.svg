<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Instagram Post Template - JoyofCare">
  <title>JoyofCare Instagram Post Template</title>
  <desc>Template Instagram 1080x1080 untuk posting rutin artikel kesehatan dan tips.</desc>

  <defs>
    <linearGradient id="igBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="warmGradIg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <linearGradient id="igSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="igShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#igBg)"/>

  <!-- Decorative shapes -->
  <circle cx="120" cy="120" r="180" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="960" cy="960" r="220" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="200" r="80" fill="#7ED957" opacity="0.3"/>
  <circle cx="80" cy="900" r="60" fill="#FC9000" opacity="0.4"/>

  <!-- Brand header -->
  <g transform="translate(60, 60)">
    <circle cx="24" cy="24" r="24" fill="#FFFFFF"/>
    <path d="M 24 14 C 19 8, 9 8, 9 16 C 9 22, 24 33, 24 33 C 24 33, 39 22, 39 16 C 39 8, 29 8, 24 14 Z" fill="#2D9C4A"/>
    <text x="64" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Joy</text>
    <text x="115" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="400" fill="#E8F5EC">of Care</text>
    <text x="64" y="42" font-family="Inter, sans-serif" font-size="13" fill="#A7E5BC">joyofcare.net</text>
  </g>

  <!-- Category badge -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="320" height="44" rx="22" fill="#FFFFFF"/>
    <text x="160" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A6B30" text-anchor="middle" letter-spacing="3">LANSIA SEHAT</text>
  </g>

  <!-- Main content card -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="960" height="600" rx="32" fill="url(#igSecondary)" filter="url(#igShadow)"/>

    <!-- Big icon -->
    <g transform="translate(380, 60)">
      <circle cx="100" cy="100" r="90" fill="#FFFFFF"/>
      <!-- Heart with house -->
      <path d="M 100 50 C 75 25, 35 35, 35 65 C 35 100, 100 160, 100 160 C 100 160, 165 100, 165 65 C 165 35, 125 25, 100 50 Z" fill="#FC9000"/>
      <path d="M 100 90 L 70 110 L 70 135 L 90 135 L 90 120 L 110 120 L 110 135 L 130 135 L 130 110 Z" fill="#FFFFFF"/>
    </g>

    <!-- Title -->
    <text x="60" y="320" font-family="Montserrat, Inter, sans-serif" font-size="52" font-weight="800" fill="#1A1A2E">5 Cara Merawat</text>
    <text x="60" y="375" font-family="Montserrat, Inter, sans-serif" font-size="52" font-weight="800" fill="#1A6B30">Orang Tua di Rumah</text>

    <!-- Subtitle -->
    <text x="60" y="430" font-family="Inter, sans-serif" font-size="22" fill="#475569">Panduan praktis untuk keluarga Indonesia</text>

    <!-- Quick tips -->
    <g transform="translate(60, 470)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">✓ Nutrisi seimbang</text>
      <text x="0" y="35" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">✓ Aktivitas ringan rutin</text>
      <text x="0" y="70" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">✓ Cek kesehatan berkala</text>
    </g>
    <g transform="translate(490, 470)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">✓ Pencegahan jatuh</text>
      <text x="0" y="35" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">✓ Kualitas tidur</text>
      <text x="0" y="70" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">✓ Vaksinasi tepat</text>
    </g>
  </g>

  <!-- CTA section -->
  <g transform="translate(60, 870)">
    <rect x="0" y="0" width="960" height="130" rx="24" fill="url(#warmGradIg)" filter="url(#igShadow)"/>
    <text x="40" y="50" font-family="Montserrat, Inter, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Konsultasi Gratis</text>
    <text x="40" y="80" font-family="Inter, sans-serif" font-size="16" fill="#FFFFFF">WhatsApp sekarang untuk layanan ke rumah</text>
    <text x="40" y="108" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">08811-118-911</text>

    <!-- WhatsApp icon -->
    <g transform="translate(870, 30)">
      <circle cx="40" cy="40" r="40" fill="#FFFFFF"/>
      <path d="M 40 18 C 28 18, 18 28, 18 40 C 18 46, 20 51, 24 55 L 21 65 L 31 62 C 35 64, 38 65, 40 65 C 52 65, 62 55, 62 43 C 62 31, 52 18, 40 18 Z M 50 53 C 49 54, 47 55, 45 55 C 43 55, 41 54, 39 53 C 35 51, 30 47, 27 41 C 26 39, 25 37, 27 35 C 28 34, 28 34, 29 34 C 30 34, 30 34, 31 35 L 32 38 C 32 39, 32 39, 31 40 L 30 41 C 32 44, 35 46, 38 47 L 39 46 C 40 45, 41 45, 42 46 L 44 47 C 45 47, 45 48, 44 49 Z" fill="#25D366"/>
    </g>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(60, 1020)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="14" fill="#A7E5BC">Baca panduan lengkap di bio link 👆</text>
    <text x="960" y="13" font-family="Inter, sans-serif" font-size="14" fill="#A7E5BC" text-anchor="end">#LansiaSehat #JoyOfCare</text>
  </g>
</svg>