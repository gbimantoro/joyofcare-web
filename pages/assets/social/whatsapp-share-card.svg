<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="WhatsApp Share Card - JoyofCare">
  <title>JoyofCare WhatsApp Share Card</title>
  <desc>Kartu berbagi WhatsApp untuk blog JoyofCare dengan tombol konsultasi langsung.</desc>

  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="heroGreenWa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <filter id="waShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F0F2F5"/>
  <!-- Soft gradient blob -->
  <circle cx="100" cy="80" r="180" fill="#25D366" opacity="0.1"/>
  <circle cx="1100" cy="550" r="200" fill="#2D9C4A" opacity="0.1"/>

  <!-- WhatsApp Phone Mockup -->
  <g transform="translate(60, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="380" height="530" rx="40" fill="#1F1F1F" filter="url(#waShadow)"/>
    <rect x="10" y="10" width="360" height="510" rx="30" fill="#0B141A"/>

    <!-- Status bar -->
    <text x="40" y="40" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">9:41</text>
    <g transform="translate(310, 30)">
      <rect x="0" y="0" width="3" height="10" fill="#FFFFFF" rx="1"/>
      <rect x="5" y="0" width="3" height="10" fill="#FFFFFF" rx="1"/>
      <rect x="10" y="0" width="3" height="10" fill="#FFFFFF" rx="1"/>
      <rect x="15" y="3" width="20" height="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" rx="2"/>
    </g>

    <!-- WhatsApp header -->
    <rect x="10" y="50" width="360" height="70" fill="#128C7E"/>
    <circle cx="40" cy="85" r="18" fill="#FFFFFF"/>
    <text x="40" y="92" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#128C7E" text-anchor="middle">J</text>
    <text x="75" y="83" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Joy of Care</text>
    <text x="75" y="103" font-family="Inter, sans-serif" font-size="11" fill="#E0F2F1">online</text>

    <!-- Chat bubble - incoming -->
    <g transform="translate(25, 145)">
      <path d="M 0 20 Q 0 0, 20 0 L 320 0 Q 340 0, 340 20 L 340 80 Q 340 100, 320 100 L 30 100 L 15 115 L 18 100 Q 0 100, 0 80 Z" fill="#FFFFFF"/>
      <text x="20" y="25" font-family="Inter, sans-serif" font-size="11" fill="#1A1A2E">Halo! 👋 Saya ingin tanya soal</text>
      <text x="20" y="42" font-family="Inter, sans-serif" font-size="11" fill="#1A1A2E">fisioterapi untuk ayah saya</text>
      <text x="20" y="59" font-family="Inter, sans-serif" font-size="11" fill="#1A1A2E">yang mengalami patah tulang.</text>
      <text x="20" y="85" font-family="Inter, sans-serif" font-size="9" fill="#64748B">10:23 ✓✓</text>
    </g>

    <!-- Chat bubble - outgoing reply -->
    <g transform="translate(25, 285)">
      <path d="M 20 0 L 320 0 Q 340 0, 340 20 L 340 80 Q 340 100, 320 100 L 20 100 Q 0 100, 0 80 L 0 20 Q 0 0, 20 0 Z" fill="#D9FDD3"/>
      <text x="20" y="25" font-family="Inter, sans-serif" font-size="11" fill="#1A1A2E">Halo! Terima kasih sudah menghubungi</text>
      <text x="20" y="42" font-family="Inter, sans-serif" font-size="11" fill="#1A1A2E">Joy of Care 😊 Kami bisa kirim</text>
      <text x="20" y="59" font-family="Inter, sans-serif" font-size="11" fill="#1A1A2E">fisioterapis ke rumah Anda.</text>
      <text x="310" y="85" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="end">10:24 ✓✓</text>
    </g>

    <!-- CTA card in chat -->
    <g transform="translate(35, 405)">
      <rect x="0" y="0" width="310" height="80" rx="12" fill="url(#waBg)"/>
      <text x="20" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">📅 Booking Jadwal</text>
      <text x="20" y="45" font-family="Inter, sans-serif" font-size="11" fill="#E0F2F1">Pilih jadwal kunjungan tim kami</text>
      <rect x="20" y="55" width="270" height="20" rx="10" fill="#FFFFFF"/>
      <text x="155" y="69" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#128C7E" text-anchor="middle">Lihat Jadwal</text>
    </g>
  </g>

  <!-- RIGHT CONTENT -->
  <g transform="translate(490, 80)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#25D366"/>
    <text x="90" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CHAT WHATSAPP</text>

    <text x="0" y="100" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#1A1A2E">Konsultasi</text>
    <text x="0" y="155" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#1A6B30">Langsung via</text>
    <text x="0" y="210" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#25D366">WhatsApp</text>

    <text x="0" y="255" font-family="Inter, sans-serif" font-size="17" fill="#475569">Dokter, perawat, dan fisioterapis</text>
    <text x="0" y="278" font-family="Inter, sans-serif" font-size="17" fill="#475569">siap melayani keluarga Anda 24/7.</text>

    <!-- Number card -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="640" height="80" rx="16" fill="#FFFFFF" filter="url(#waShadow)"/>
      <circle cx="40" cy="40" r="24" fill="#25D366"/>
      <path d="M 40 24 C 33 18, 22 21, 22 30 C 22 38, 30 50, 30 50 L 22 56 L 32 56 L 32 60 L 35 56 C 42 60, 56 56, 56 48 L 56 30 C 56 21, 47 18, 40 24 Z" fill="#FFFFFF" transform="scale(0.7) translate(15,10)"/>
      <text x="80" y="50" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#1A1A2E">08811-118-911</text>
      <text x="80" y="68" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Tap untuk chat langsung • Respons cepat</text>

      <rect x="500" y="22" width="120" height="36" rx="18" fill="#25D366"/>
      <text x="560" y="46" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chat →</text>
    </g>
  </g>

  <!-- Footer brand -->
  <g transform="translate(490, 560)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="13" fill="#64748B">joyofcare.net • Layanan kesehatan ke rumah Jabodetabek</text>
  </g>
</svg>