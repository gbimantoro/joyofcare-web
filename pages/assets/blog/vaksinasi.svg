<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kategori Viralisasi - JoyofCare">
  <title>Vaksinasi - Vaccination</title>
  <desc>Thumbnail kategori blog Vaksinasi dari JoyofCare, layanan vaksinasi di rumah untuk keluarga.</desc>

  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F4FAFF"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="warmAccent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>

    <filter id="softShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dots4" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#00bf63" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad4)"/>
  <rect width="1200" height="630" fill="url(#dots4)"/>

  <circle cx="1080" cy="540" r="180" fill="#00bf63" opacity="0.1"/>
  <circle cx="120" cy="120" r="140" fill="#FC9000" opacity="0.08"/>

  <g transform="translate(70, 90)">
    <g>
      <rect x="0" y="0" width="280" height="44" rx="22" fill="#0E7490"/>
      <text x="140" y="29" font-family="Inter, Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KATEGORI BLOG</text>
    </g>

    <text x="0" y="125" font-family="Montserrat, Inter, sans-serif" font-size="68" font-weight="800" fill="#1A1A2E">Vaksinasi</text>
    <text x="0" y="195" font-family="Montserrat, Inter, sans-serif" font-size="56" font-weight="800" fill="#0E7490">di Rumah</text>

    <text x="0" y="245" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Layanan vaksinasi praktis untuk keluarga</text>
    <text x="0" y="272" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Datang ke rumah Anda, tanpa antre</text>

    <g transform="translate(0, 310)">
      <circle cx="10" cy="10" r="5" fill="#0E7490"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Vaksin pneumonia untuk lansia</text>
    </g>
    <g transform="translate(0, 345)">
      <circle cx="10" cy="10" r="5" fill="#0E7490"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Vaksin anak &amp; dewasa</text>
    </g>
    <g transform="translate(0, 380)">
      <circle cx="10" cy="10" r="5" fill="#0E7490"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Vaksin internasional studi</text>
    </g>
  </g>

  <g transform="translate(640, 110)">
    <rect x="0" y="0" width="500" height="410" rx="32" fill="#FFFFFF" filter="url(#softShadow4)"/>

    <!-- Shield with cross -->
    <g transform="translate(150, 50)">
      <path d="M 100 0 L 0 40 L 0 130 C 0 200, 50 240, 100 250 C 150 240, 200 200, 200 130 L 200 40 Z" fill="url(#shieldGrad)"/>
      <!-- Medical cross -->
      <rect x="80" y="80" width="40" height="100" fill="#FFFFFF" rx="4"/>
      <rect x="50" y="110" width="100" height="40" fill="#FFFFFF" rx="4"/>
      <!-- Highlight -->
      <path d="M 100 0 L 0 40 L 0 80 C 50 70, 100 65, 100 60 Z" fill="#FFFFFF" opacity="0.15"/>
    </g>

    <!-- Syringe icon -->
    <g transform="translate(60, 230)" rotate="-30">
      <rect x="0" y="20" width="100" height="22" fill="#E0F2FE" stroke="#0E7490" stroke-width="2" rx="2"/>
      <rect x="100" y="25" width="30" height="12" fill="#0E7490"/>
      <rect x="-20" y="28" width="20" height="6" fill="#475569"/>
      <rect x="130" y="27" width="40" height="3" fill="#475569"/>
      <rect x="135" y="33" width="40" height="3" fill="#475569"/>
    </g>

    <!-- Floating vaccine vial -->
    <g transform="translate(380, 50)">
      <rect x="0" y="20" width="50" height="80" fill="#FFFFFF" stroke="#00bf63" stroke-width="3" rx="4"/>
      <rect x="10" y="5" width="30" height="20" fill="#00bf63" rx="2"/>
      <rect x="10" y="50" width="30" height="40" fill="#7ED957" opacity="0.6"/>
      <text x="25" y="45" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#1A1A2E" text-anchor="middle">VAC</text>
    </g>

    <!-- Floating tag -->
    <g transform="translate(320, 30)">
      <rect x="0" y="0" width="160" height="48" rx="24" fill="url(#warmAccent4)"/>
      <text x="80" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 Panduan</text>
    </g>
  </g>

  <g transform="translate(70, 555)">
    <circle cx="14" cy="14" r="14" fill="#00bf63"/>
    <path d="M 14 8 C 11 4, 5 4, 5 9 C 5 13, 14 20, 14 20 C 14 20, 23 13, 23 9 C 23 4, 17 4, 14 8 Z" fill="#FFFFFF"/>
    <text x="42" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#007A3D">Joy</text>
    <text x="80" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="400" fill="#1A1A2E">of Care</text>
    <text x="42" y="32" font-family="Inter, sans-serif" font-size="13" fill="#64748B">joyofcare.net/blog/vaksinasi</text>
  </g>
</svg>