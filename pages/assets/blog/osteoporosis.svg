<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kategori Osteoporosis - JoyofCare">
  <title>Osteoporosis Lansia - Joy of Care</title>
  <desc>Thumbnail kategori blog Osteoporosis Lansia dari JoyofCare, panduan pencegahan patah tulang dan terapi kalsium di rumah.</desc>

  <defs>
    <linearGradient id="bgGradOst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFFBF4"/>
      <stop offset="100%" stop-color="#F4FAF6"/>
    </linearGradient>
    <linearGradient id="primaryOst" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="accentOst" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="shieldGradOst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <filter id="shadowOst" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dotsOst" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#00bf63" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradOst)"/>
  <rect width="1200" height="630" fill="url(#dotsOst)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="140" r="190" fill="#00bf63" opacity="0.12"/>
  <circle cx="140" cy="530" r="150" fill="#FC9000" opacity="0.08"/>

  <!-- LEFT CONTENT BLOCK -->
  <g transform="translate(80, 90)">
    <!-- Category badge -->
    <g>
      <rect x="0" y="0" width="280" height="44" rx="22" fill="#00bf63"/>
      <text x="140" y="29" font-family="Inter, Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KATEGORI BLOG</text>
    </g>

    <!-- Title -->
    <text x="0" y="125" font-family="Montserrat, Inter, sans-serif" font-size="64" font-weight="800" fill="#1A1A2E">Osteoporosis</text>
    <text x="0" y="195" font-family="Montserrat, Inter, sans-serif" font-size="56" font-weight="800" fill="#007A3D">pada Lansia</text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Pencegahan patah tulang &amp; terapi medis di rumah</text>
    <text x="0" y="272" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Infus kalsium, nutrisi tulang, dan fisioterapi geriatri</text>

    <!-- Bullets -->
    <g transform="translate(0, 315)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Skrining kepadatan tulang &amp; risiko fraktur</text>
    </g>
    <g transform="translate(0, 350)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Layanan terapi infus &amp; injeksi kalsium di rumah</text>
    </g>
    <g transform="translate(0, 385)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Program latihan penguatan otot penopang sendi</text>
    </g>

    <!-- CTA Pill -->
    <g transform="translate(0, 430)">
      <rect x="0" y="0" width="270" height="46" rx="23" fill="url(#accentOst)" filter="url(#shadowOst)"/>
      <text x="135" y="29" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Konsultasi Joy of Care →</text>
    </g>
  </g>

  <!-- RIGHT ILLUSTRATION: Bone Health & Medical Shield -->
  <g transform="translate(850, 300)" filter="url(#shadowOst)">
    <!-- Base Glow Disc -->
    <circle cx="0" cy="0" r="180" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="0" r="150" fill="url(#bgGradOst)"/>

    <!-- Protective Medical Shield -->
    <path d="M-90,-100 Q0,-120 90,-100 Q100,50 0,140 Q-100,50 -90,-100 Z" fill="url(#shieldGradOst)" opacity="0.2"/>
    <path d="M-80,-90 Q0,-110 80,-90 Q90,40 0,125 Q-90,40 -80,-90 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Bone Vector Illustration -->
    <g transform="translate(-10, -50) scale(1.1)">
      <!-- Stylized Bone -->
      <path d="M-30,-40 C-45,-40 -55,-25 -45,-10 C-40,-5 -30,-5 -25,0 L-25,60 C-30,65 -40,65 -45,70 C-55,85 -45,100 -30,100 C-15,100 -10,88 0,85 C10,88 15,100 30,100 C45,100 55,85 45,70 C40,65 30,65 25,60 L25,0 C30,-5 40,-5 45,-10 C55,-25 45,-40 30,-40 C15,-40 10,-28 0,-25 C-10,-28 -15,-40 -30,-40 Z"
            fill="url(#boneGrad)" stroke="#00bf63" stroke-width="4"/>
      <!-- Bone Density Sparkles -->
      <circle cx="-10" cy="20" r="4" fill="#00bf63"/>
      <circle cx="12" cy="40" r="3" fill="#FC9000"/>
      <circle cx="0" cy="-5" r="3.5" fill="#0E7490"/>
      <circle cx="-8" cy="50" r="3" fill="#00bf63"/>
      <circle cx="10" cy="10" r="4" fill="#FC9000"/>
    </g>

    <!-- Strong Spine / Strength Indicator -->
    <g transform="translate(60, 30)">
      <rect x="0" y="0" width="48" height="48" rx="24" fill="#FC9000" filter="url(#shadowOst)"/>
      <path d="M16,24 L22,30 L32,18" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(-80, -70)">
      <rect x="0" y="0" width="44" height="44" rx="22" fill="#00bf63" filter="url(#shadowOst)"/>
      <path d="M22,12 L22,32 M12,22 L32,22" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
