<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kategori Studi Luar Negeri - JoyofCare">
  <title>Studi Luar Negeri - Study Abroad Health</title>
  <desc>Thumbnail kategori blog Studi di Luar Negeri dari JoyofCare, persyaratan kesehatan mahasiswa internasional.</desc>

  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5EC"/>
      <stop offset="100%" stop-color="#F4FAF6"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="heroGreen3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>

    <filter id="softShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dots3" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#00bf63" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad3)"/>
  <rect width="1200" height="630" fill="url(#dots3)"/>

  <circle cx="1080" cy="120" r="180" fill="#3B82F6" opacity="0.1"/>
  <circle cx="120" cy="540" r="160" fill="#00bf63" opacity="0.1"/>

  <g transform="translate(70, 90)">
    <g>
      <rect x="0" y="0" width="280" height="44" rx="22" fill="#007A3D"/>
      <text x="140" y="29" font-family="Inter, Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KATEGORI BLOG</text>
    </g>

    <text x="0" y="125" font-family="Montserrat, Inter, sans-serif" font-size="58" font-weight="800" fill="#1A1A2E">Studi</text>
    <text x="0" y="190" font-family="Montserrat, Inter, sans-serif" font-size="58" font-weight="800" fill="#007A3D">Luar Negeri</text>

    <text x="0" y="240" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Persyaratan kesehatan untuk mahasiswa</text>
    <text x="0" y="267" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">internasional Australia, Eropa, dll.</text>

    <g transform="translate(0, 305)">
      <circle cx="10" cy="10" r="5" fill="#007A3D"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Surat keterangan sehat</text>
    </g>
    <g transform="translate(0, 340)">
      <circle cx="10" cy="10" r="5" fill="#007A3D"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Vaksinasi internasional</text>
    </g>
    <g transform="translate(0, 375)">
      <circle cx="10" cy="10" r="5" fill="#007A3D"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Medical check-up untuk visa</text>
    </g>
  </g>

  <g transform="translate(640, 110)">
    <rect x="0" y="0" width="500" height="410" rx="32" fill="#FFFFFF" filter="url(#softShadow3)"/>

    <!-- Globe -->
    <g transform="translate(250, 130)">
      <circle cx="0" cy="0" r="100" fill="url(#globeGrad)"/>
      <!-- Latitude lines -->
      <ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="100" ry="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <!-- Longitude lines -->
      <ellipse cx="0" cy="0" rx="30" ry="100" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="60" ry="100" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Continents (abstract shapes) -->
      <path d="M -50 -30 Q -20 -40, 10 -25 Q 30 -10, 20 15 Q 0 25, -30 15 Z" fill="#00bf63" opacity="0.85"/>
      <path d="M 30 25 Q 55 20, 65 35 Q 55 50, 40 45 Z" fill="#00bf63" opacity="0.85"/>
      <path d="M -55 30 Q -40 25, -35 45 Q -50 55, -60 45 Z" fill="#00bf63" opacity="0.85"/>
    </g>

    <!-- Plane flying around -->
    <g transform="translate(80, 60)" rotate="-15">
      <path d="M 0 15 L 60 10 L 80 0 L 90 5 L 70 18 L 60 15 L 50 25 L 55 30 L 35 28 L 20 18 Z" fill="#FC9000"/>
    </g>

    <!-- Travel pins on globe -->
    <g transform="translate(180, 50)">
      <path d="M 15 0 C 7 0, 0 7, 0 15 C 0 25, 15 45, 15 45 C 15 45, 30 25, 30 15 C 30 7, 23 0, 15 0 Z" fill="#FC9000"/>
      <circle cx="15" cy="15" r="6" fill="#FFFFFF"/>
    </g>
    <g transform="translate(360, 250)">
      <path d="M 15 0 C 7 0, 0 7, 0 15 C 0 25, 15 45, 15 45 C 15 45, 30 25, 30 15 C 30 7, 23 0, 15 0 Z" fill="#FC9000"/>
      <circle cx="15" cy="15" r="6" fill="#FFFFFF"/>
    </g>
    <g transform="translate(110, 270)">
      <path d="M 15 0 C 7 0, 0 7, 0 15 C 0 25, 15 45, 15 45 C 15 45, 30 25, 30 15 C 30 7, 23 0, 15 0 Z" fill="#FC9000"/>
      <circle cx="15" cy="15" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Floating tag -->
    <g transform="translate(320, 30)">
      <rect x="0" y="0" width="160" height="48" rx="24" fill="url(#heroGreen3)"/>
      <text x="80" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7 Panduan</text>
    </g>
  </g>

  <g transform="translate(70, 555)">
    <circle cx="14" cy="14" r="14" fill="#00bf63"/>
    <path d="M 14 8 C 11 4, 5 4, 5 9 C 5 13, 14 20, 14 20 C 14 20, 23 13, 23 9 C 23 4, 17 4, 14 8 Z" fill="#FFFFFF"/>
    <text x="42" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#007A3D">Joy</text>
    <text x="80" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="400" fill="#1A1A2E">of Care</text>
    <text x="42" y="32" font-family="Inter, sans-serif" font-size="13" fill="#64748B">joyofcare.net/blog/studi-luar-negeri</text>
  </g>
</svg>