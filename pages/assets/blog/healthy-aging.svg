<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kategori Lansia Sehat - JoyofCare">
  <title>Healthy Aging - Lansia Sehat</title>
  <desc>Thumbnail kategori blog Lansia Sehat dari JoyofCare, layanan kesehatan lansia di rumah.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5EC"/>
      <stop offset="100%" stop-color="#F4FAF6"/>
    </linearGradient>
    <linearGradient id="heroGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Decorative leaf pattern -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#00bf63" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Soft accent circles -->
  <circle cx="1080" cy="120" r="180" fill="#7ED957" opacity="0.15"/>
  <circle cx="120" cy="540" r="160" fill="#FC9000" opacity="0.08"/>

  <!-- LEFT CONTENT BLOCK -->
  <g transform="translate(70, 90)">
    <!-- Category badge -->
    <g>
      <rect x="0" y="0" width="280" height="44" rx="22" fill="#00bf63"/>
      <text x="140" y="29" font-family="Inter, Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KATEGORI BLOG</text>
    </g>

    <!-- Title -->
    <text x="0" y="125" font-family="Montserrat, Inter, sans-serif" font-size="68" font-weight="800" fill="#1A1A2E">Lansia</text>
    <text x="0" y="195" font-family="Montserrat, Inter, sans-serif" font-size="68" font-weight="800" fill="#007A3D">Sehat</text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Perawatan ahli untuk orang tua Anda</text>
    <text x="0" y="272" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Fisioterapi, dokter, dan perawat ke rumah</text>

    <!-- Bullet features -->
    <g transform="translate(0, 310)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Fisioterapi lansia</text>
    </g>
    <g transform="translate(0, 345)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Perawatan Parkinson &amp; Osteoporosis</text>
    </g>
    <g transform="translate(0, 380)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Cegah jatuh &amp; rawat pasca operasi</text>
    </g>
  </g>

  <!-- RIGHT ILLUSTRATION BLOCK -->
  <g transform="translate(640, 110)">
    <!-- Card -->
    <rect x="0" y="0" width="500" height="410" rx="32" fill="#FFFFFF" filter="url(#softShadow)"/>

    <!-- House shape with heart inside (caring home) -->
    <g transform="translate(110, 70)">
      <!-- Roof -->
      <path d="M 140 0 L 0 110 L 280 110 Z" fill="url(#heroGreen)"/>
      <!-- House body -->
      <rect x="20" y="110" width="240" height="170" fill="#E8F5EC" stroke="#00bf63" stroke-width="3"/>
      <!-- Door -->
      <rect x="115" y="200" width="50" height="80" fill="#00bf63" rx="4"/>
      <circle cx="155" cy="240" r="3" fill="#FC9000"/>
      <!-- Window left -->
      <rect x="40" y="140" width="60" height="60" fill="#FFFFFF" stroke="#00bf63" stroke-width="3" rx="4"/>
      <line x1="70" y1="140" x2="70" y2="200" stroke="#00bf63" stroke-width="2"/>
      <line x1="40" y1="170" x2="100" y2="170" stroke="#00bf63" stroke-width="2"/>
      <!-- Window right -->
      <rect x="180" y="140" width="60" height="60" fill="#FFFFFF" stroke="#00bf63" stroke-width="3" rx="4"/>
      <line x1="210" y1="140" x2="210" y2="200" stroke="#00bf63" stroke-width="2"/>
      <line x1="180" y1="170" x2="240" y2="170" stroke="#00bf63" stroke-width="2"/>

      <!-- Heart on roof (caring touch) -->
      <path d="M 140 -50 C 130 -65, 110 -65, 110 -50 C 110 -38, 140 -25, 140 -25 C 140 -25, 170 -38, 170 -50 C 170 -65, 150 -65, 140 -50 Z" fill="#FC9000"/>
    </g>

    <!-- Caring leaf decoration -->
    <g transform="translate(40, 350)" opacity="0.85">
      <path d="M 0 30 Q 30 0, 60 30 Q 30 60, 0 30 Z" fill="#7ED957"/>
      <line x1="30" y1="20" x2="30" y2="40" stroke="#007A3D" stroke-width="1.5"/>
    </g>

    <!-- Floating tag -->
    <g transform="translate(320, 30)">
      <rect x="0" y="0" width="160" height="48" rx="24" fill="url(#warmAccent)"/>
      <text x="80" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">29 Artikel</text>
    </g>
  </g>

  <!-- FOOTER BRAND -->
  <g transform="translate(70, 555)">
    <circle cx="14" cy="14" r="14" fill="#00bf63"/>
    <path d="M 14 8 C 11 4, 5 4, 5 9 C 5 13, 14 20, 14 20 C 14 20, 23 13, 23 9 C 23 4, 17 4, 14 8 Z" fill="#FFFFFF"/>
    <text x="42" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#007A3D">Joy</text>
    <text x="80" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="400" fill="#1A1A2E">of Care</text>
    <text x="42" y="32" font-family="Inter, sans-serif" font-size="13" fill="#64748B">joyofcare.net/blog/healthy-aging</text>
  </g>
</svg>