<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Instagram Carousel Template Slide 1 - Cover - JoyofCare">
  <title>Instagram Carousel Template — Slide 1 (Cover) — JoyofCare</title>
  <desc>Cover slide template for Instagram carousel 1080x1350. Edit headline and CTA before use.</desc>

  <defs>
    <linearGradient id="heroGreenCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="warmOrangeCar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="cardShadowCar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#heroGreenCar)"/>
  <circle cx="120" cy="120" r="240" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="960" cy="1230" r="260" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="980" cy="220" r="90" fill="#7ED957" opacity="0.3"/>
  <circle cx="100" cy="1100" r="70" fill="#FC9000" opacity="0.4"/>

  <!-- Brand header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#FFFFFF"/>
    <path d="M 24 14 C 19 8, 9 8, 9 16 C 9 22, 24 33, 24 33 C 24 33, 39 22, 39 16 C 39 8, 29 8, 24 14 Z" fill="#00bf63"/>
    <text x="68" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Joy</text>
    <text x="119" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="400" fill="#E8F5EC">of Care</text>
    <text x="68" y="42" font-family="Inter, sans-serif" font-size="13" fill="#A7E5BC">joyofcare.net</text>
  </g>

  <!-- Slide indicator -->
  <g transform="translate(900, 70)">
    <rect x="0" y="0" width="120" height="44" rx="22" fill="#FFFFFF"/>
    <text x="60" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#007A3D" text-anchor="middle">SLIDE 01</text>
  </g>

  <!-- Number badge (large, branded) -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="280" height="80" rx="40" fill="#FFFFFF"/>
    <text x="140" y="56" font-family="Montserrat, sans-serif" font-size="44" font-weight="800" fill="#007A3D" text-anchor="middle">1 / 5</text>
  </g>

  <!-- Cover card -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="960" height="780" rx="40" fill="#FFFFFF" filter="url(#cardShadowCar)"/>

    <!-- Big icon -->
    <g transform="translate(380, 50)">
      <circle cx="100" cy="100" r="100" fill="#E8F5EC"/>
      <!-- Heart+house icon -->
      <path d="M 100 45 C 70 18, 25 30, 25 65 C 25 105, 100 165, 100 165 C 100 165, 175 105, 175 65 C 175 30, 130 18, 100 45 Z" fill="#FC9000"/>
      <path d="M 100 90 L 65 112 L 65 142 L 88 142 L 88 128 L 112 128 L 112 142 L 135 142 L 135 112 Z" fill="#FFFFFF"/>
    </g>

    <!-- EDITABLE Title -->
    <text x="60" y="320" font-family="Montserrat, sans-serif" font-size="54" font-weight="800" fill="#1A1A2E">Judul Carousel</text>
    <text x="60" y="380" font-family="Montserrat, sans-serif" font-size="54" font-weight="800" fill="#007A3D">Yang Menarik</text>

    <!-- EDITABLE Description -->
    <text x="60" y="430" font-family="Inter, sans-serif" font-size="22" fill="#475569">Penjelasan singkat tentang isi carousel</text>

    <!-- Promise / bullet benefits -->
    <g transform="translate(60, 480)">
      <rect x="0" y="0" width="840" height="60" rx="14" fill="#F0FDF4"/>
      <text x="30" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#007A3D">✓ Kamu akan belajar tentang [topik utama]</text>
    </g>
    <g transform="translate(60, 555)">
      <rect x="0" y="0" width="840" height="60" rx="14" fill="#F0FDF4"/>
      <text x="30" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#007A3D">✓ Dapat tips praktis untuk [tujuan]</text>
    </g>
    <g transform="translate(60, 630)">
      <rect x="0" y="0" width="840" height="60" rx="14" fill="#F0FDF4"/>
      <text x="30" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#007A3D">✓ Panduan dari ahli kesehatan profesional</text>
    </g>
  </g>

  <!-- CTA Footer -->
  <g transform="translate(60, 1150)">
    <rect x="0" y="0" width="960" height="120" rx="24" fill="url(#warmOrangeCar)" filter="url(#cardShadowCar)"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">SWIPE UNTUK BACA →</text>
    <text x="40" y="78" font-family="Inter, sans-serif" font-size="15" fill="#FFFFFF">5 tips bermanfaat menanti di slide berikutnya</text>
    <text x="40" y="105" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.95">WhatsApp: 08811-118-911</text>
  </g>

  <!-- Footer hashtags -->
  <g transform="translate(60, 1310)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="13" fill="#A7E5BC">#JoyOfCare #KesehatanDiRumah @joyof.care</text>
  </g>
</svg>