<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Twitter/X Image Template - JoyofCare">
  <title>Twitter/X Image Template — JoyofCare</title>
  <desc>Clean minimal Twitter/X image template 1200x675 (16:9) optimized for timeline preview.</desc>

  <defs>
    <linearGradient id="twBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="warmOrangeTw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="twShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#twBg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="675" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="675" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Brand top left -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="44" height="44" rx="22" fill="#FFFFFF"/>
    <path d="M 22 12 C 17 6, 7 6, 7 14 C 7 20, 22 32, 22 32 C 22 32, 37 20, 37 14 C 37 6, 27 6, 22 12 Z" fill="#00bf63"/>
    <text x="62" y="20" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#007A3D">Joy</text>
    <text x="108" y="20" font-family="Montserrat, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF">of Care</text>
    <text x="62" y="38" font-family="Inter, sans-serif" font-size="12" fill="#A7E5BC">joyofcare.net</text>
  </g>

  <!-- X/Twitter badge top right -->
  <g transform="translate(1040, 60)">
    <circle cx="40" cy="22" r="22" fill="#FFFFFF"/>
    <g transform="translate(28, 10)" fill="#1A1A2E">
      <path d="M 0 0 L 8 12 L 0 24 L 2.5 24 L 9 14 L 14 24 L 24 24 L 16 11 L 23 0 L 20.5 0 L 14 9 L 9 0 Z"/>
    </g>
  </g>

  <!-- Main headline -->
  <g transform="translate(60, 200)">
    <text x="0" y="0" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#A7E5BC" letter-spacing="3">THREAD / POST</text>

    <text x="0" y="90" font-family="Montserrat, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Headline</text>
    <text x="0" y="160" font-family="Montserrat, sans-serif" font-size="64" font-weight="800" fill="#FC9000">Pendek</text>
    <text x="0" y="230" font-family="Montserrat, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Singkat Padat</text>
  </g>

  <!-- Right side icon -->
  <g transform="translate(820, 180)">
    <circle cx="140" cy="140" r="130" fill="rgba(255,255,255,0.1)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
    <!-- Health icon -->
    <g transform="translate(70, 70)">
      <circle cx="70" cy="70" r="60" fill="#FFFFFF"/>
      <path d="M 70 30 C 50 15, 20 22, 20 45 C 20 70, 70 115, 70 115 C 70 115, 120 70, 120 45 C 120 22, 90 15, 70 30 Z" fill="#FC9000"/>
      <path d="M 70 60 L 50 75 L 50 92 L 65 92 L 65 82 L 75 82 L 75 92 L 90 92 L 90 75 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Bullet points / tags -->
  <g transform="translate(60, 510)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="100" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">#JoyOfCare</text>
  </g>
  <g transform="translate(270, 510)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="110" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">#Kesehatan</text>
  </g>
  <g transform="translate(60, 555)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="100" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">#LansiaSehat</text>
  </g>
  <g transform="translate(270, 555)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="120" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">#FisioterapiRumah</text>
  </g>

  <!-- CTA Bottom -->
  <g transform="translate(60, 615)">
    <rect x="0" y="0" width="380" height="36" rx="18" fill="url(#warmOrangeTw)"/>
    <text x="190" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chat: 08811-118-911 →</text>
  </g>
</svg>