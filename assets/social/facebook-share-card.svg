<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Facebook Share Card - JoyofCare">
  <title>JoyofCare Facebook Share Card</title>
  <desc>Kartu berbagi Facebook untuk blog JoyofCare dengan ajakan membaca artikel.</desc>

  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5EC"/>
      <stop offset="100%" stop-color="#F4FAF6"/>
    </linearGradient>
    <linearGradient id="heroGreenFb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="warmGradFb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="fbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#fbBg)"/>

  <!-- Decorative -->
  <circle cx="1100" cy="100" r="160" fill="#2D9C4A" opacity="0.1"/>
  <circle cx="100" cy="530" r="140" fill="#FC9000" opacity="0.1"/>

  <!-- LEFT - Mockup browser -->
  <g transform="translate(60, 60)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="540" height="510" rx="20" fill="#FFFFFF" filter="url(#fbShadow)"/>
    <!-- Browser chrome -->
    <rect x="0" y="0" width="540" height="44" rx="20" fill="#F1F5F9"/>
    <rect x="0" y="20" width="540" height="24" fill="#F1F5F9"/>
    <circle cx="22" cy="22" r="6" fill="#EF4444"/>
    <circle cx="42" cy="22" r="6" fill="#FC9000"/>
    <circle cx="62" cy="22" r="6" fill="#22C55E"/>
    <rect x="100" y="10" width="400" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="120" y="27" font-family="Inter, sans-serif" font-size="11" fill="#64748B">🔒 joyofcare.net/blog/lansia-sehat/...</text>

    <!-- Article hero image area -->
    <rect x="0" y="44" width="540" height="220" fill="url(#heroGreenFb)"/>
    <!-- Decorative pattern -->
    <circle cx="450" cy="100" r="100" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="100" cy="220" r="60" fill="#FFFFFF" opacity="0.1"/>

    <!-- Title overlay -->
    <text x="30" y="120" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Panduan Lengkap</text>
    <text x="30" y="160" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Merawat Lansia</text>
    <text x="30" y="195" font-family="Inter, sans-serif" font-size="14" fill="#E8F5EC">By JoyofCare Medical Team</text>

    <!-- Article body -->
    <g transform="translate(30, 290)">
      <rect x="0" y="0" width="480" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="0" y="20" width="430" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="0" y="40" width="460" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="0" y="60" width="380" height="6" rx="3" fill="#E2E8F0"/>
    </g>

    <!-- CTA button -->
    <g transform="translate(30, 380)">
      <rect x="0" y="0" width="200" height="44" rx="22" fill="url(#warmGradFb)"/>
      <text x="100" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Baca Selengkapnya →</text>
    </g>

    <!-- Like/share bar -->
    <g transform="translate(30, 440)">
      <rect x="0" y="0" width="480" height="40" rx="20" fill="#F1F5F9"/>
      <text x="20" y="25" font-family="Inter, sans-serif" font-size="12" fill="#475569">👍❤️👏 234 reactions</text>
      <text x="460" y="25" font-family="Inter, sans-serif" font-size="12" fill="#475569" text-anchor="end">42 comments • 18 shares</text>
    </g>
  </g>

  <!-- RIGHT - Content -->
  <g transform="translate(660, 80)">
    <g>
      <rect x="0" y="0" width="220" height="40" rx="20" fill="#1877F2"/>
      <text x="110" y="27" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SHARE KE FACEBOOK</text>
    </g>

    <text x="0" y="115" font-family="Montserrat, Inter, sans-serif" font-size="44" font-weight="800" fill="#1A1A2E">Layanan</text>
    <text x="0" y="170" font-family="Montserrat, Inter, sans-serif" font-size="44" font-weight="800" fill="#1A6B30">Kesehatan</text>
    <text x="0" y="225" font-family="Montserrat, Inter, sans-serif" font-size="44" font-weight="800" fill="#1877F2">Profesional</text>
    <text x="0" y="270" font-family="Montserrat, Inter, sans-serif" font-size="44" font-weight="800" fill="#1A1A2E">ke Rumah Anda</text>

    <text x="0" y="315" font-family="Inter, sans-serif" font-size="18" fill="#475569">Dokter, perawat, fisioterapis, dan</text>
    <text x="0" y="340" font-family="Inter, sans-serif" font-size="18" fill="#475569">tenaga medis profesional datang langsung</text>
    <text x="0" y="365" font-family="Inter, sans-serif" font-size="18" fill="#475569">ke rumah untuk melayani keluarga Anda.</text>

    <!-- Tags -->
    <g transform="translate(0, 405)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#E8F5EC"/>
      <text x="50" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1A6B30" text-anchor="middle">#Lansia</text>
    </g>
    <g transform="translate(110, 405)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#EFF6FF"/>
      <text x="65" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1877F2" text-anchor="middle">#Kesehatan</text>
    </g>
    <g transform="translate(0, 445)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#FFF7ED"/>
      <text x="75" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#B85800" text-anchor="middle">#Homecare</text>
    </g>
    <g transform="translate(160, 445)">
      <rect x="0" y="0" width="170" height="32" rx="16" fill="#F0F9FF"/>
      <text x="85" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0E7490" text-anchor="middle">#Fisioterapi</text>
    </g>

    <!-- Footer link -->
    <g transform="translate(0, 500)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" fill="#64748B">📍 Melayani Jakarta, Tangerang, Depok, Bogor</text>
    </g>
  </g>
</svg>