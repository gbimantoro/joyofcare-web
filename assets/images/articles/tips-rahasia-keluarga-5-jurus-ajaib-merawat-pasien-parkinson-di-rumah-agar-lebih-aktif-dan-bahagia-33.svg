<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7C3AED" flood-opacity="0.14"/>
    </filter>
    <pattern id="dotPattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#7C3AED" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotPattern)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="1100" cy="90" r="240" fill="#7C3AED" opacity="0.06"/>
  <circle cx="120" cy="560" r="200" fill="#6D28D9" opacity="0.04"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 75)">
    <!-- Top Pill: Category + Verification Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="36" rx="18" fill="#EDE9FE"/>
      <circle cx="18" cy="18" r="6" fill="#7C3AED"/>
      <text x="34" y="23" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#5B21B6" letter-spacing="1">PARKINSON &amp; SARAF MOTORIK</text>
    </g>

    <!-- Medical Review Trust Badge -->
    <g transform="translate(315, 0)">
      <rect x="0" y="0" width="230" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <path d="M14 18 L19 23 L28 13" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Review Tim Medis JOC</text>
    </g>

    <!-- Dynamic Multi-line Title -->
    <text x="0" y="145" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.8">Cara Merawat Pasien Parkinson di</text>
<text x="0" y="193" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.8">Rumah</text>

    <!-- Keyword Highlight Pill -->
    <g transform="translate(0, 266)">
      <rect x="0" y="0" width="540" height="42" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="6" height="42" rx="3" fill="#7C3AED"/>
      <text x="20" y="26" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">
        Fokus Klinis: <tspan font-weight="700" fill="#6D28D9">cara merawat pasien parkinson di rumah</tspan>
      </text>
    </g>

    <!-- Checklist / Value Points -->
    <g transform="translate(0, 331)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#7C3AED" fill-opacity="0.15"/>
        <path d="M6 10 L9 13 L14 7" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="14" font-family="Inter, sans-serif" font-size="13.5" font-weight="600" fill="#334155">Standar Komprehensif Dokter &amp; Perawat Berlisensi STR/SIP</text>
      </g>
      <g transform="translate(0, 30)">
        <circle cx="10" cy="10" r="10" fill="#7C3AED" fill-opacity="0.15"/>
        <path d="M6 10 L9 13 L14 7" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="14" font-family="Inter, sans-serif" font-size="13.5" font-weight="600" fill="#334155">Layanan Home Visit Jabodetabek • Siaga Hotline 08811-118-911</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Focus Card -->
  <g filter="url(#cardShadow)">
    <rect x="710" y="65" width="410" height="500" rx="32" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="725" y="80" width="380" height="470" rx="24" fill="#F5F3FF"/>
    
    <!-- Vector Motif Graphic -->
    
        <g transform="translate(770, 180)">
          <circle cx="120" cy="120" r="105" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4" filter="url(#shadow)"/>
          <!-- Neuro Synapse Nodes -->
          <circle cx="120" cy="90" r="18" fill="#7C3AED"/>
          <circle cx="75" cy="140" r="14" fill="#6D28D9"/>
          <circle cx="165" cy="140" r="14" fill="#6D28D9"/>
          <circle cx="120" cy="175" r="12" fill="#7C3AED"/>
          <line x1="120" y1="90" x2="75" y2="140" stroke="#7C3AED" stroke-width="5"/>
          <line x1="120" y1="90" x2="165" y2="140" stroke="#7C3AED" stroke-width="5"/>
          <line x1="75" y1="140" x2="120" y2="175" stroke="#6D28D9" stroke-width="4"/>
          <line x1="165" y1="140" x2="120" y2="175" stroke="#6D28D9" stroke-width="4"/>
        </g>
        

    <!-- Bottom Stamp in Card -->
    <g transform="translate(745, 480)">
      <rect x="0" y="0" width="340" height="46" rx="23" fill="#0F172A"/>
      <text x="170" y="28" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JOY OF CARE • PROTOKOL RESMI</text>
    </g>
  </g>
</svg>