<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="50%" stop-color="#F4FDF9"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0D9488" flood-opacity="0.14"/>
    </filter>
    <pattern id="dotPattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#0D9488" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotPattern)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="1100" cy="90" r="240" fill="#0D9488" opacity="0.06"/>
  <circle cx="120" cy="560" r="200" fill="#0F766E" opacity="0.04"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 75)">
    <!-- Top Pill: Category + Verification Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="36" rx="18" fill="#CCFBF1"/>
      <circle cx="18" cy="18" r="6" fill="#0D9488"/>
      <text x="34" y="23" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#115E59" letter-spacing="1">PERAWAT MEDIS HOMECARE</text>
    </g>

    <!-- Medical Review Trust Badge -->
    <g transform="translate(315, 0)">
      <rect x="0" y="0" width="230" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <path d="M14 18 L19 23 L28 13" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Review Tim Medis JOC</text>
    </g>

    <!-- Dynamic Multi-line Title -->
    <text x="0" y="145" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.8">Perawatan Kolostomi di Rumah:</text>
<text x="0" y="193" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.8">Cegah Iritasi dan Bocor</text>

    <!-- Keyword Highlight Pill -->
    <g transform="translate(0, 266)">
      <rect x="0" y="0" width="540" height="42" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="6" height="42" rx="3" fill="#0D9488"/>
      <text x="20" y="26" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">
        Fokus Klinis: <tspan font-weight="700" fill="#0F766E">perawatan stoma kolostomi di rumah perawat</tspan>
      </text>
    </g>

    <!-- Checklist / Value Points -->
    <g transform="translate(0, 331)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#0D9488" fill-opacity="0.15"/>
        <path d="M6 10 L9 13 L14 7" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="14" font-family="Inter, sans-serif" font-size="13.5" font-weight="600" fill="#334155">Standar Komprehensif Dokter &amp; Perawat Berlisensi STR/SIP</text>
      </g>
      <g transform="translate(0, 30)">
        <circle cx="10" cy="10" r="10" fill="#0D9488" fill-opacity="0.15"/>
        <path d="M6 10 L9 13 L14 7" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="14" font-family="Inter, sans-serif" font-size="13.5" font-weight="600" fill="#334155">Layanan Home Visit Jabodetabek • Siaga Hotline 08811-118-911</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Focus Card -->
  <g filter="url(#cardShadow)">
    <rect x="710" y="65" width="410" height="500" rx="32" fill="#FFFFFF" stroke="#0D9488" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="725" y="80" width="380" height="470" rx="24" fill="#F0FDFA"/>
    
    <!-- Vector Motif Graphic -->
    
        <g transform="translate(770, 180)">
          <circle cx="120" cy="120" r="105" fill="#FFFFFF" stroke="#0D9488" stroke-width="4" filter="url(#shadow)"/>
          <!-- Medical Cross in Shield -->
          <path d="M120 40 L180 65 L180 130 C180 180 120 205 120 205 C120 205 60 180 60 130 L60 65 Z" fill="#0D9488" opacity="0.15"/>
          <rect x="105" y="70" width="30" height="85" rx="6" fill="#0D9488"/>
          <rect x="77" y="97" width="85" height="30" rx="6" fill="#0D9488"/>
          <!-- Caring Hands Base -->
          <path d="M50 190 Q120 230 190 190" fill="none" stroke="#0F766E" stroke-width="6" stroke-linecap="round"/>
        </g>
        

    <!-- Bottom Stamp in Card -->
    <g transform="translate(745, 480)">
      <rect x="0" y="0" width="340" height="46" rx="23" fill="#0F172A"/>
      <text x="170" y="28" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JOY OF CARE • PROTOKOL RESMI</text>
    </g>
  </g>
</svg>