<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Fisioterapi untuk Lansia - Infografis JoyofCare">
  <title>Fisioterapi untuk Lansia - Infografis</title>
  <desc>5 latihan fisioterapi yang bisa dilakukan di rumah untuk menjaga mobilitas dan keseimbangan lansia.</desc>

  <defs>
    <linearGradient id="headBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="exCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F9FA"/>
    </linearGradient>
    <linearGradient id="warmGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="cardShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#F8F9FA"/>

  <rect width="1080" height="300" fill="url(#headBg3)"/>
  <circle cx="980" cy="80" r="130" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="100" cy="270" r="80" fill="#FFFFFF" opacity="0.08"/>

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#FFFFFF"/>
    <text x="90" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1A6B30" text-anchor="middle" letter-spacing="2">LANSIA SEHAT</text>
  </g>

  <text x="60" y="160" font-family="Montserrat, Inter, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">5 Latihan Fisioterapi</text>
  <text x="60" y="210" font-family="Montserrat, Inter, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">untuk Lansia di Rumah</text>
  <text x="60" y="248" font-family="Inter, sans-serif" font-size="18" fill="#E8F5EC">Jaga mobilitas, keseimbangan, &amp; kekuatan otot</text>

  <!-- Exercise 1: Jalan Kaki -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="460" height="220" rx="20" fill="url(#exCardBg)" filter="url(#cardShadow3)"/>
    <!-- Number badge -->
    <circle cx="40" cy="40" r="22" fill="#2D9C4A"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>

    <!-- Icon -->
    <g transform="translate(30, 90)">
      <circle cx="50" cy="50" r="42" fill="#E8F5EC"/>
      <!-- Walking person -->
      <circle cx="50" cy="32" r="10" fill="#1A6B30"/>
      <line x1="50" y1="42" x2="50" y2="62" stroke="#1A6B30" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="38" y2="62" stroke="#1A6B30" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="62" y2="42" stroke="#1A6B30" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="62" x2="40" y2="82" stroke="#1A6B30" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="62" x2="60" y2="82" stroke="#1A6B30" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="160" y="105" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Jalan Kaki Santai</text>
    <text x="160" y="135" font-family="Inter, sans-serif" font-size="14" fill="#475569">15-30 menit setiap hari</text>
    <text x="160" y="158" font-family="Inter, sans-serif" font-size="13" fill="#1A6B30" font-weight="600">✓ Meningkatkan stamina</text>
    <text x="160" y="178" font-family="Inter, sans-serif" font-size="13" fill="#1A6B30" font-weight="600">✓ Baik untuk jantung</text>
  </g>

  <!-- Exercise 2: Chair Stand -->
  <g transform="translate(560, 340)">
    <rect x="0" y="0" width="460" height="220" rx="20" fill="url(#exCardBg)" filter="url(#cardShadow3)"/>
    <circle cx="40" cy="40" r="22" fill="#2D9C4A"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>

    <g transform="translate(30, 90)">
      <circle cx="50" cy="50" r="42" fill="#E8F5EC"/>
      <!-- Chair -->
      <rect x="35" y="55" width="30" height="6" fill="#1A6B30"/>
      <rect x="35" y="55" width="4" height="20" fill="#1A6B30"/>
      <rect x="61" y="55" width="4" height="20" fill="#1A6B30"/>
      <!-- Standing person -->
      <circle cx="50" cy="30" r="8" fill="#1A6B30"/>
      <line x1="50" y1="38" x2="50" y2="54" stroke="#1A6B30" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="160" y="105" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Berdiri dari Kursi</text>
    <text x="160" y="135" font-family="Inter, sans-serif" font-size="14" fill="#475569">10-15 repetisi, 2x sehari</text>
    <text x="160" y="158" font-family="Inter, sans-serif" font-size="13" fill="#1A6B30" font-weight="600">✓ Melatih otot kaki</text>
    <text x="160" y="178" font-family="Inter, sans-serif" font-size="13" fill="#1A6B30" font-weight="600">✓ Keseimbangan harian</text>
  </g>

  <!-- Exercise 3: Balance -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="460" height="220" rx="20" fill="url(#exCardBg)" filter="url(#cardShadow3)"/>
    <circle cx="40" cy="40" r="22" fill="#FC9000"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>

    <g transform="translate(30, 90)">
      <circle cx="50" cy="50" r="42" fill="#FFF7ED"/>
      <!-- Balancing person -->
      <circle cx="50" cy="22" r="8" fill="#B85800"/>
      <line x1="50" y1="30" x2="50" y2="62" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="38" x2="32" y2="48" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="38" x2="68" y2="48" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="62" x2="45" y2="82" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="62" x2="55" y2="82" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="160" y="105" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Berdiri Satu Kaki</text>
    <text x="160" y="135" font-family="Inter, sans-serif" font-size="14" fill="#475569">Tahan 10-30 detik, ganti kaki</text>
    <text x="160" y="158" font-family="Inter, sans-serif" font-size="13" fill="#B85800" font-weight="600">✓ Latih keseimbangan</text>
    <text x="160" y="178" font-family="Inter, sans-serif" font-size="13" fill="#B85800" font-weight="600">✓ Cegah jatuh</text>
  </g>

  <!-- Exercise 4: Stretching -->
  <g transform="translate(560, 580)">
    <rect x="0" y="0" width="460" height="220" rx="20" fill="url(#exCardBg)" filter="url(#cardShadow3)"/>
    <circle cx="40" cy="40" r="22" fill="#FC9000"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>

    <g transform="translate(30, 90)">
      <circle cx="50" cy="50" r="42" fill="#FFF7ED"/>
      <!-- Stretching person -->
      <circle cx="50" cy="35" r="8" fill="#B85800"/>
      <line x1="50" y1="43" x2="50" y2="68" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="25" y2="42" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="75" y2="42" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="68" x2="42" y2="82" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="68" x2="58" y2="82" stroke="#B85800" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="160" y="105" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Peregangan Lembut</text>
    <text x="160" y="135" font-family="Inter, sans-serif" font-size="14" fill="#475569">Tahan 15-30 detik per gerakan</text>
    <text x="160" y="158" font-family="Inter, sans-serif" font-size="13" fill="#B85800" font-weight="600">✓ Tingkatkan fleksibilitas</text>
    <text x="160" y="178" font-family="Inter, sans-serif" font-size="13" fill="#B85800" font-weight="600">✓ Redakan nyeri otot</text>
  </g>

  <!-- Exercise 5: Hand Exercise -->
  <g transform="translate(60, 820)">
    <rect x="0" y="0" width="960" height="200" rx="20" fill="url(#exCardBg)" filter="url(#cardShadow3)"/>
    <circle cx="40" cy="40" r="22" fill="#0E7490"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>

    <g transform="translate(30, 80)">
      <circle cx="50" cy="50" r="42" fill="#EFF6FF"/>
      <!-- Hand squeeze -->
      <circle cx="50" cy="50" r="25" fill="none" stroke="#0E7490" stroke-width="3"/>
      <circle cx="50" cy="50" r="15" fill="#0E7490"/>
    </g>

    <text x="160" y="100" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Latihan Genggaman Tangan</text>
    <text x="160" y="128" font-family="Inter, sans-serif" font-size="14" fill="#475569">Gunakan bola lembut atau handuk, 10-15 repetisi per tangan</text>
    <text x="160" y="155" font-family="Inter, sans-serif" font-size="13" fill="#0E7490" font-weight="600">✓ Memperkuat genggaman</text>
    <text x="320" y="155" font-family="Inter, sans-serif" font-size="13" fill="#0E7490" font-weight="600">✓ Bantu aktivitas sehari-hari</text>
  </g>

  <!-- Tips Box -->
  <g transform="translate(60, 1050)">
    <rect x="0" y="0" width="960" height="170" rx="20" fill="#FFF7ED" stroke="#FC9000" stroke-width="2"/>
    <text x="30" y="40" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#B85800">⚠ Tips Penting</text>
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" fill="#1A1A2E">• Mulai perlahan, jangan memaksakan diri</text>
      <text x="0" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1A1A2E">• Berhenti jika merasa pusing atau nyeri hebat</text>
      <text x="0" y="50" font-family="Inter, sans-serif" font-size="14" fill="#1A1A2E">• Konsultasikan dengan dokter atau fisioterapis terlebih dahulu</text>
    </g>
    <g transform="translate(490, 60)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" fill="#1A1A2E">• Minum air putih yang cukup</text>
      <text x="0" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1A1A2E">• Latih di pagi atau sore hari</text>
      <text x="0" y="50" font-family="Inter, sans-serif" font-size="14" fill="#1A1A2E">• Pilih alas kaki yang nyaman &amp; anti-slip</text>
    </g>
  </g>

  <!-- CTA Footer -->
  <g transform="translate(60, 1240)">
    <rect x="0" y="0" width="960" height="80" rx="40" fill="url(#warmGrad2)"/>
    <text x="60" y="50" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Butuh Fisioterapis ke Rumah?</text>
    <text x="900" y="50" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="end">08811-118-911 →</text>
  </g>
</svg>