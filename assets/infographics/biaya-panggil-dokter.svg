<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Infografis Biaya Panggil Dokter ke Rumah - JoyofCare">
  <title>Biaya Panggil Dokter ke Rumah - Infografis</title>
  <desc>Perbandingan biaya panggil dokter ke rumah vs klinik, keuntungan dan tips.</desc>

  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="heroGreen5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#F8F9FA"/>

  <!-- HEADER -->
  <rect width="1080" height="320" fill="url(#headBg)"/>
  <!-- Decorative shapes -->
  <circle cx="950" cy="80" r="120" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="80" cy="280" r="80" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1020" cy="240" r="40" fill="#7ED957" opacity="0.3"/>

  <!-- Header content -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#FFFFFF"/>
    <text x="90" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1A6B30" text-anchor="middle" letter-spacing="2">INFOGRAFIS</text>
  </g>

  <text x="60" y="170" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">Biaya Panggil Dokter</text>
  <text x="60" y="225" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">ke Rumah</text>
  <text x="60" y="275" font-family="Inter, sans-serif" font-size="20" fill="#E8F5EC">Panduan harga lengkap untuk keluarga Indonesia</text>

  <!-- COMPARISON CARD -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="960" height="320" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <text x="30" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Perbandingan Biaya</text>

    <!-- Klinik column -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="420" height="200" rx="16" fill="#FEF3F2"/>
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="50" height="50" rx="12" fill="#EF4444"/>
        <text x="25" y="33" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">R</text>
      </g>
      <text x="90" y="48" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">Klinik / RS</text>
      <text x="90" y="68" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Datang ke tempat praktik</text>

      <text x="20" y="115" font-family="Inter, sans-serif" font-size="14" fill="#475569">Konsultasi dokter umum</text>
      <text x="380" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E" text-anchor="end">Rp 150-300rb</text>
      <line x1="20" y1="125" x2="400" y2="125" stroke="#E2E8F0" stroke-width="1"/>

      <text x="20" y="148" font-family="Inter, sans-serif" font-size="14" fill="#475569">Transportasi</text>
      <text x="380" y="148" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E" text-anchor="end">Rp 30-100rb</text>
      <line x1="20" y1="158" x2="400" y2="158" stroke="#E2E8F0" stroke-width="1"/>

      <text x="20" y="181" font-family="Inter, sans-serif" font-size="14" fill="#475569">Waktu tunggu</text>
      <text x="380" y="181" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#EF4444" text-anchor="end">1-3 jam</text>
    </g>

    <!-- JoyofCare column -->
    <g transform="translate(490, 90)">
      <rect x="0" y="0" width="440" height="200" rx="16" fill="#E8F5EC" stroke="#2D9C4A" stroke-width="2"/>
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="50" height="50" rx="12" fill="#2D9C4A"/>
        <text x="25" y="33" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
      </g>
      <text x="90" y="48" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1A6B30">Joy of Care</text>
      <text x="90" y="68" font-family="Inter, sans-serif" font-size="13" fill="#1A6B30">Dokter datang ke rumah Anda</text>

      <text x="20" y="115" font-family="Inter, sans-serif" font-size="14" fill="#475569">Konsultasi dokter</text>
      <text x="400" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E" text-anchor="end">Rp 350-650rb</text>
      <line x1="20" y1="125" x2="420" y2="125" stroke="#7ED957" stroke-width="1"/>

      <text x="20" y="148" font-family="Inter, sans-serif" font-size="14" fill="#475569">Transportasi</text>
      <text x="400" y="148" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2D9C4A" text-anchor="end">GRATIS</text>
      <line x1="20" y1="158" x2="420" y2="158" stroke="#7ED957" stroke-width="1"/>

      <text x="20" y="181" font-family="Inter, sans-serif" font-size="14" fill="#475569">Waktu tunggu</text>
      <text x="400" y="181" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2D9C4A" text-anchor="end">30-60 menit</text>
    </g>
  </g>

