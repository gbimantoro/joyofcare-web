  <g transform="translate(60, 720)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Mengapa Panggil Dokter ke Rumah?</text>

    <!-- Benefit 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="220" height="180" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="40" cy="40" r="22" fill="#E8F5EC"/>
      <path d="M 40 30 C 35 23, 27 23, 27 30 C 27 35, 40 45, 40 45 C 40 45, 53 35, 53 30 C 53 23, 45 23, 40 30 Z" fill="#2D9C4A"/>
      <text x="20" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Nyaman</text>
      <text x="20" y="115" font-family="Inter, sans-serif" font-size="13" fill="#475569">Tanpa antre,</text>
      <text x="20" y="135" font-family="Inter, sans-serif" font-size="13" fill="#475569">tanpa bepergian</text>
      <text x="20" y="155" font-family="Inter, sans-serif" font-size="13" fill="#475569">untuk lansia</text>
    </g>

    <!-- Benefit 2 -->
    <g transform="translate(245, 30)">
      <rect x="0" y="0" width="220" height="180" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="40" cy="40" r="22" fill="#FFF7ED"/>
      <path d="M 40 28 L 42 35 L 49 35 L 43 39 L 45 46 L 40 42 L 35 46 L 37 39 L 31 35 L 38 35 Z" fill="#FC9000"/>
      <text x="20" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Profesional</text>
      <text x="20" y="115" font-family="Inter, sans-serif" font-size="13" fill="#475569">Dokter</text>
      <text x="20" y="135" font-family="Inter, sans-serif" font-size="13" fill="#475569">berpengalaman</text>
      <text x="20" y="155" font-family="Inter, sans-serif" font-size="13" fill="#475569">&amp; bersertifikat</text>
    </g>

    <!-- Benefit 3 -->
    <g transform="translate(490, 30)">
      <rect x="0" y="0" width="220" height="180" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="40" cy="40" r="22" fill="#EFF6FF"/>
      <path d="M 40 28 L 50 35 L 50 42 C 50 47, 45 52, 40 52 C 35 52, 30 47, 30 42 L 30 35 Z" fill="#0E7490"/>
      <text x="20" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Aman</text>
      <text x="20" y="115" font-family="Inter, sans-serif" font-size="13" fill="#475569">Mengurangi</text>
      <text x="20" y="135" font-family="Inter, sans-serif" font-size="13" fill="#475569">risiko infeksi</text>
      <text x="20" y="155" font-family="Inter, sans-serif" font-size="13" fill="#475569">di RS</text>
    </g>

    <!-- Benefit 4 -->
    <g transform="translate(735, 30)">
      <rect x="0" y="0" width="220" height="180" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="40" cy="40" r="22" fill="#F0FDF4"/>
      <text x="40" y="48" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#2D9C4A" text-anchor="middle">24/7</text>
      <text x="20" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Siap Setiap Saat</text>
      <text x="20" y="115" font-family="Inter, sans-serif" font-size="13" fill="#475569">Layanan darurat</text>
      <text x="20" y="135" font-family="Inter, sans-serif" font-size="13" fill="#475569">siaga 24 jam</text>
      <text x="20" y="155" font-family="Inter, sans-serif" font-size="13" fill="#475569">untuk keluarga</text>
    </g>
  </g>

  <!-- PRICING TIERS -->
  <g transform="translate(60, 980)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Pilihan Layanan</text>

    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="20" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">DOKTER UMUM</text>
      <text x="20" y="75" font-family="Montserrat, Inter, sans-serif" font-size="32" font-weight="800" fill="#2D9C4A">Rp 350K</text>
      <text x="20" y="95" font-family="Inter, sans-serif" font-size="13" fill="#475569">per kunjungan</text>
      <text x="20" y="130" font-family="Inter, sans-serif" font-size="13" fill="#1A1A2E">✓ Konsultasi 30 menit</text>
      <text x="20" y="155" font-family="Inter, sans-serif" font-size="13" fill="#1A1A2E">✓ Pemeriksaan dasar</text>
    </g>

    <g transform="translate(330, 30)">
      <rect x="0" y="0" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="20" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">DOKTER SPESIALIS</text>
      <text x="20" y="75" font-family="Montserrat, Inter, sans-serif" font-size="32" font-weight="800" fill="#2D9C4A">Rp 650K</text>
      <text x="20" y="95" font-family="Inter, sans-serif" font-size="13" fill="#475569">per kunjungan</text>
      <text x="20" y="130" font-family="Inter, sans-serif" font-size="13" fill="#1A1A2E">✓ Konsultasi 45 menit</text>
      <text x="20" y="155" font-family="Inter, sans-serif" font-size="13" fill="#1A1A2E">✓ Resep &amp; tindakan</text>
    </g>

    <g transform="translate(660, 30)">
      <rect x="0" y="0" width="300" height="180" rx="16" fill="url(#heroGreen5)" filter="url(#cardShadow)"/>
      <rect x="20" y="20" width="80" height="22" rx="11" fill="#FC9000"/>
      <text x="60" y="35" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">POPULER</text>
      <text x="20" y="80" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#E8F5EC" letter-spacing="1">PAKET BULANAN</text>
      <text x="20" y="120" font-family="Montserrat, Inter, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Mulai 1.2jt</text>
      <text x="20" y="140" font-family="Inter, sans-serif" font-size="13" fill="#E8F5EC">per bulan (4 kunjungan)</text>
      <text x="20" y="170" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">✓ Prioritas 24/7</text>
    </g>
  </g>

  <!-- CTA Footer -->
  <g transform="translate(60, 1230)">
    <rect x="0" y="0" width="960" height="80" rx="40" fill="url(#warmGrad)"/>
    <text x="60" y="50" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Konsultasi Gratis Sekarang</text>
    <text x="900" y="50" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="end">08811-118-911 →</text>
  </g>
</svg>