<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad_siaga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="accentGrad_siaga" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="softShadow_siaga" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#9F1239" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow_siaga" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <pattern id="gridDots_siaga" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#E11D48" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad_siaga)"/>
  <rect width="1200" height="630" fill="url(#gridDots_siaga)"/>

  <circle cx="1100" cy="100" r="220" fill="#E11D48" opacity="0.06"/>
  <circle cx="150" cy="550" r="180" fill="#EA580C" opacity="0.05"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 68)">
    <!-- Category Pill Badge -->
    <g>
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#E11D48" fill-opacity="0.12"/>
      <rect x="0" y="0" width="280" height="38" rx="19" fill="none" stroke="#E11D48" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="7" fill="#E11D48"/>
      <text x="38" y="24" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#BE123C" letter-spacing="1.1">SIAGA BENCANA &amp; ABU VULKANIK</text>
    </g>

    <!-- Punchy Titles (3C Rule) -->
    <text x="0" y="102" font-family="Montserrat, Inter, sans-serif" font-size="50" font-weight="800" fill="#0F172A" letter-spacing="-1">Siaga Erupsi Vulkanik</text>
    <text x="0" y="160" font-family="Montserrat, Inter, sans-serif" font-size="50" font-weight="800" fill="#E11D48" letter-spacing="-1">Mitigasi Medis &amp; Pernapasan</text>

    <!-- Subtitle -->
    <text x="0" y="214" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="500" fill="#475569">
      <tspan x="0" dy="0">Protokol darurat perlindungan abu silika vulkanik,</tspan>
      <tspan x="0" dy="26">masker N95, pembersihan tandon, dan dokter visit.</tspan>
    </text>

    <!-- Features / Steps -->
    <g transform="translate(0, 280)">
      <g transform="translate(0, 0)">
        <circle cx="16" cy="16" r="16" fill="#E11D48" fill-opacity="0.15"/>
        <path d="M10 16 L14 20 L22 12" fill="none" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Filtrasi Pernapasan N95 &amp; Air Purifier HEPA</text>
      </g>
      <g transform="translate(0, 48)">
        <circle cx="16" cy="16" r="16" fill="#E11D48" fill-opacity="0.15"/>
        <path d="M10 16 L14 20 L22 12" fill="none" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Penanganan Cepat ISPA, Asma &amp; Bronkitis di Rumah</text>
      </g>
      <g transform="translate(0, 96)">
        <circle cx="16" cy="16" r="16" fill="#E11D48" fill-opacity="0.15"/>
        <path d="M10 16 L14 20 L22 12" fill="none" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Uji Lab Air Bersih &amp; Terapi Nebulizer Homecare</text>
      </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="280" height="48" rx="24" fill="url(#accentGrad_siaga)" filter="url(#badgeShadow_siaga)"/>
      <text x="140" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Konsultasi Siaga Vulkanik →</text>
    </g>
  </g>

  <!-- Right Visual Card -->
  <g filter="url(#softShadow_siaga)">
    <rect x="648" y="63" width="484" height="504" rx="30" fill="#FFFFFF" stroke="#E11D48" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Vector Illustration Background -->
    <rect x="668" y="83" width="444" height="464" rx="22" fill="#FFF1F2"/>
    
    <!-- Mountain Silhouette -->
    <path d="M700 480 L820 280 L900 370 L970 240 L1080 480 Z" fill="#E2E8F0" opacity="0.7"/>
    <path d="M740 480 L850 310 L920 400 L960 330 L1040 480 Z" fill="#CBD5E1" opacity="0.8"/>
    
    <!-- Volcanic Plume (Stylized) -->
    <path d="M950 240 Q940 180 970 140 Q1010 110 1050 140 Q1080 180 1060 220 Z" fill="#94A3B8" opacity="0.35"/>
    <circle cx="1020" cy="150" r="35" fill="#F97316" opacity="0.25"/>
    <circle cx="980" cy="170" r="25" fill="#E11D48" opacity="0.2"/>
    
    <!-- Shield & Medical Cross Motif -->
    <g transform="translate(820, 210)">
      <path d="M70 0 L140 30 L140 100 C140 160 70 200 70 200 C70 200 0 160 0 100 L0 30 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="4" filter="url(#badgeShadow_siaga)"/>
      <!-- Medical Cross -->
      <rect x="55" y="50" width="30" height="90" rx="6" fill="#E11D48"/>
      <rect x="25" y="80" width="90" height="30" rx="6" fill="#E11D48"/>
    </g>

    <!-- N95 Mask Icon Floating -->
    <g transform="translate(710, 360)">
      <rect x="0" y="0" width="130" height="70" rx="16" fill="#FFFFFF" stroke="#00bf63" stroke-width="2" filter="url(#badgeShadow_siaga)"/>
      <text x="65" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#007A3D" text-anchor="middle">N95 FILTRASI</text>
      <text x="65" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Efisiensi 95% Silika</text>
    </g>

    <!-- Badge at bottom of card -->
    <g transform="translate(740, 480)">
      <rect x="0" y="0" width="300" height="44" rx="22" fill="#0F172A"/>
      <text x="150" y="27" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">JOY OF CARE • SIAGA DARURAT</text>
    </g>
  </g>
</svg>