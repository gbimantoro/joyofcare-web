<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kategori Parkinson - JoyofCare">
  <title>Perawatan Parkinson di Rumah - Joy of Care</title>
  <desc>Thumbnail kategori blog Parkinson dari JoyofCare, panduan perawatan neuromotor, fisioterapi, dan dukungan keluarga di rumah.</desc>

  <defs>
    <linearGradient id="bgGradPark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFFBF4"/>
      <stop offset="100%" stop-color="#F4FAF6"/>
    </linearGradient>
    <linearGradient id="primaryPark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="accentPark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <linearGradient id="neuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <filter id="shadowPark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dotsPark" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#00bf63" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradPark)"/>
  <rect width="1200" height="630" fill="url(#dotsPark)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="140" r="190" fill="#00bf63" opacity="0.12"/>
  <circle cx="140" cy="530" r="150" fill="#FC9000" opacity="0.08"/>

  <!-- LEFT CONTENT BLOCK -->
  <g transform="translate(80, 90)">
    <!-- Category badge -->
    <g>
      <rect x="0" y="0" width="280" height="44" rx="22" fill="#00bf63"/>
      <text x="140" y="29" font-family="Inter, Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KATEGORI BLOG</text>
    </g>

    <!-- Title -->
    <text x="0" y="125" font-family="Montserrat, Inter, sans-serif" font-size="68" font-weight="800" fill="#1A1A2E">Parkinson</text>
    <text x="0" y="195" font-family="Montserrat, Inter, sans-serif" font-size="56" font-weight="800" fill="#007A3D">Perawatan di Rumah</text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Pemulihan neuromotor &amp; dukungan keluarga</text>
    <text x="0" y="272" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#475569">Fisioterapi, terapi wicara, dan pendampingan</text>

    <!-- Bullets -->
    <g transform="translate(0, 315)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Latihan mobilitas, keseimbangan &amp; cegah jatuh</text>
    </g>
    <g transform="translate(0, 350)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Panduan obat, nutrisi &amp; rutinitas harian</text>
    </g>
    <g transform="translate(0, 385)">
      <circle cx="10" cy="10" r="5" fill="#00bf63"/>
      <text x="30" y="16" font-family="Inter, sans-serif" font-size="16" fill="#1A1A2E">Perawat pendamping &amp; fisioterapis ke rumah</text>
    </g>

    <!-- CTA Pill -->
    <g transform="translate(0, 430)">
      <rect x="0" y="0" width="270" height="46" rx="23" fill="url(#accentPark)" filter="url(#shadowPark)"/>
      <text x="135" y="29" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Konsultasi Joy of Care →</text>
    </g>
  </g>

  <!-- RIGHT ILLUSTRATION: Neural Recovery & Movement -->
  <g transform="translate(850, 300)" filter="url(#shadowPark)">
    <!-- Base Glow Disc -->
    <circle cx="0" cy="0" r="180" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="0" r="150" fill="url(#bgGradPark)"/>

    <!-- Neural network: synapse connections (neuromotor recovery) -->
    <g stroke-linecap="round">
      <line x1="0" y1="-10" x2="-70" y2="-70" stroke="#0E7490" stroke-width="3" opacity="0.55"/>
      <line x1="0" y1="-10" x2="70" y2="-75" stroke="#00bf63" stroke-width="3" opacity="0.55"/>
      <line x1="0" y1="-10" x2="-85" y2="15" stroke="#00bf63" stroke-width="3" opacity="0.55"/>
      <line x1="0" y1="-10" x2="85" y2="20" stroke="#0E7490" stroke-width="3" opacity="0.55"/>
      <line x1="0" y1="-10" x2="-40" y2="80" stroke="#FC9000" stroke-width="3" opacity="0.55"/>
      <line x1="0" y1="-10" x2="45" y2="80" stroke="#00bf63" stroke-width="3" opacity="0.55"/>
    </g>

    <!-- Satellite neurons -->
    <circle cx="-70" cy="-70" r="13" fill="#FFFFFF" stroke="#0E7490" stroke-width="4"/>
    <circle cx="70" cy="-75" r="13" fill="#FFFFFF" stroke="#00bf63" stroke-width="4"/>
    <circle cx="-85" cy="15" r="11" fill="#FFFFFF" stroke="#00bf63" stroke-width="4"/>
    <circle cx="85" cy="20" r="11" fill="#FFFFFF" stroke="#0E7490" stroke-width="4"/>
    <circle cx="-40" cy="80" r="10" fill="#FFFFFF" stroke="#FC9000" stroke-width="4"/>
    <circle cx="45" cy="80" r="10" fill="#FFFFFF" stroke="#00bf63" stroke-width="4"/>

    <!-- Central neuron (brain core) -->
    <circle cx="0" cy="-10" r="34" fill="url(#neuroGrad)"/>
    <circle cx="0" cy="-10" r="34" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <path d="M -14 -10 L -4 0 L 16 -22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Activity / movement pulse line (physiotherapy progress) -->
    <path d="M -120 45 L -95 45 L -85 25 L -70 60 L -58 38 L -48 45 L 120 45" fill="none" stroke="#FC9000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Family support: two overlapping hearts -->
    <g transform="translate(-125, -120)">
      <path d="M 14 8 C 11 4, 5 4, 5 9 C 5 13, 14 20, 14 20 C 14 20, 23 13, 23 9 C 23 4, 17 4, 14 8 Z" fill="#FC9000"/>
    </g>
    <g transform="translate(-100, -108) scale(0.75)">
      <path d="M 14 8 C 11 4, 5 4, 5 9 C 5 13, 14 20, 14 20 C 14 20, 23 13, 23 9 C 23 4, 17 4, 14 8 Z" fill="#00bf63"/>
    </g>

    <!-- Floating chips: check + plus -->
    <g transform="translate(105, -130)">
      <rect x="0" y="0" width="48" height="48" rx="24" fill="#FC9000" filter="url(#shadowPark)"/>
      <path d="M16,24 L22,30 L32,18" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-150, 55)">
      <rect x="0" y="0" width="44" height="44" rx="22" fill="#00bf63" filter="url(#shadowPark)"/>
      <path d="M22,12 L22,32 M12,22 L32,22" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Floating article-count tag -->
    <g transform="translate(95, 105)">
      <rect x="0" y="0" width="150" height="46" rx="23" fill="url(#accentPark)"/>
      <text x="75" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">12 Artikel</text>
    </g>
  </g>

  <!-- FOOTER BRAND -->
  <g transform="translate(70, 555)">
    <circle cx="14" cy="14" r="14" fill="#00bf63"/>
    <path d="M 14 8 C 11 4, 5 4, 5 9 C 5 13, 14 20, 14 20 C 14 20, 23 13, 23 9 C 23 4, 17 4, 14 8 Z" fill="#FFFFFF"/>
    <text x="42" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" fill="#007A3D">Joy</text>
    <text x="80" y="13" font-family="Montserrat, sans-serif" font-size="20" font-weight="400" fill="#1A1A2E">of Care</text>
    <text x="42" y="32" font-family="Inter, sans-serif" font-size="13" fill="#64748B">joyofcare.net/blog/parkinson</text>
  </g>
</svg>
