<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="YouTube Shorts Thumbnail Template - JoyofCare">
  <title>YouTube Shorts Thumbnail Template — JoyofCare</title>
  <desc>Click-bait style YouTube Shorts thumbnail 1080x1920 with bold text overlay, optimized for mobile feed visibility.</desc>

  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#E58200"/>
    </linearGradient>
    <linearGradient id="ytCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F9FA"/>
    </linearGradient>
    <filter id="ytShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#ytBg)"/>

  <!-- Decorative -->
  <circle cx="150" cy="200" r="250" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="950" cy="1700" r="280" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="950" cy="300" r="80" fill="#FFE4B5"/>
  <circle cx="100" cy="1600" r="60" fill="#FFE4B5"/>

  <!-- YouTube Shorts badge -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="280" height="80" rx="40" fill="#FFFFFF" filter="url(#ytShadow)"/>
    <!-- Shorts play icon -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="50" height="50" rx="10" fill="#FF0000"/>
      <path d="M 18 12 L 18 38 L 38 25 Z" fill="#FFFFFF"/>
    </g>
    <text x="160" y="50" font-family="Montserrat, sans-serif" font-size="26" font-weight="800" fill="#1A1A2E">SHORTS</text>
  </g>

  <!-- Hook shock text -->
  <g transform="translate(60, 230)" filter="url(#textShadow2)">
    <text x="0" y="180" font-family="Montserrat, sans-serif" font-size="180" font-weight="900" fill="#FFFFFF">WOW!</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(60, 460)" filter="url(#textShadow2)">
    <text x="0" y="100" font-family="Montserrat, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">5 TIPS</text>
    <text x="0" y="200" font-family="Montserrat, sans-serif" font-size="92" font-weight="900" fill="#007A3D">SEHAT</text>
    <text x="0" y="300" font-family="Montserrat, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">LANSIA</text>
    <text x="0" y="400" font-family="Montserrat, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">DI RUMAH</text>
  </g>

  <!-- Content card -->
  <g transform="translate(60, 970)">
    <rect x="0" y="0" width="960" height="500" rx="32" fill="#FFFFFF" filter="url(#ytShadow)"/>

    <text x="40" y="55" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#B85800">⚠ WAJIB TAHU!</text>
    <text x="40" y="100" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#1A1A2E">Yang Akan Kamu Pelajari:</text>

    <!-- Bullet list -->
    <g transform="translate(40, 150)">
      <rect x="0" y="0" width="42" height="42" rx="21" fill="#00bf63"/>
      <text x="21" y="29" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="62" y="29" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Nutrisi seimbang untuk lansia</text>
    </g>
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="42" height="42" rx="21" fill="#00bf63"/>
      <text x="21" y="29" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="62" y="29" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Aktivitas fisik ringan</text>
    </g>
    <g transform="translate(40, 270)">
      <rect x="0" y="0" width="42" height="42" rx="21" fill="#00bf63"/>
      <text x="21" y="29" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="62" y="29" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Cara pencegahan jatuh</text>
    </g>
    <g transform="translate(40, 330)">
      <rect x="0" y="0" width="42" height="42" rx="21" fill="#00bf63"/>
      <text x="21" y="29" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="62" y="29" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Vaksinasi yang tepat</text>
    </g>
    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="42" height="42" rx="21" fill="#00bf63"/>
      <text x="21" y="29" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
      <text x="62" y="29" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E">Cek kesehatan berkala</text>
    </g>
  </g>

  <!-- Brand bottom -->
  <g transform="translate(60, 1530)">
    <rect x="0" y="0" width="960" height="180" rx="24" fill="#FFFFFF" filter="url(#ytShadow)"/>

    <!-- Logo -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="80" height="80" rx="40" fill="#00bf63"/>
      <path d="M 40 24 C 32 14, 14 14, 14 26 C 14 36, 40 60, 40 60 C 40 60, 66 36, 66 26 C 66 14, 48 14, 40 24 Z" fill="#FFFFFF"/>
    </g>

    <text x="150" y="80" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#007A3D">Joy of Care</text>
    <text x="150" y="115" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#B85800">Chat: 08811-118-911</text>
    <text x="150" y="145" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Layanan kesehatan ke rumah Jabodetabek</text>

    <!-- Arrow -->
    <text x="920" y="115" font-family="Inter, sans-serif" font-size="48" fill="#FC9000" text-anchor="end">→</text>
  </g>

  <!-- Footer hashtags -->
  <g transform="translate(60, 1830)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">#JoyOfCare #Shorts @joyof.care #Kesehatan #Lansia</text>
    <text x="960" y="13" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85" text-anchor="end">▶ TAP TO PLAY</text>
  </g>
</svg>