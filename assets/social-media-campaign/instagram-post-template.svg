<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Instagram Post Template - JoyofCare Campaign">
  <title>Instagram Post Template — JoyofCare</title>
  <desc>Reusable Instagram post template 1080x1080 with JoyofCare branding. Customize via editing text overlay and CTA areas.</desc>

  <defs>
    <linearGradient id="heroGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="warmOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F9FA"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#heroGreen)"/>
  <!-- Decorative shapes -->
  <circle cx="100" cy="100" r="220" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="980" cy="980" r="240" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="950" cy="180" r="80" fill="#7ED957" opacity="0.3"/>
  <circle cx="120" cy="880" r="60" fill="#FC9000" opacity="0.4"/>

  <!-- HEADER: Logo + Brand -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#FFFFFF"/>
    <path d="M 24 14 C 19 8, 9 8, 9 16 C 9 22, 24 33, 24 33 C 24 33, 39 22, 39 16 C 39 8, 29 8, 24 14 Z" fill="#2D9C4A"/>
    <text x="68" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Joy</text>
    <text x="119" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="400" fill="#E8F5EC">of Care</text>
    <text x="68" y="42" font-family="Inter, sans-serif" font-size="13" fill="#A7E5BC">joyofcare.net</text>
  </g>

  <!-- Category badge (editable) -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#FFFFFF"/>
    <text x="120" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1A6B30" text-anchor="middle" letter-spacing="3">KATEGORI / TAG</text>
  </g>

  <!-- MAIN CONTENT CARD - editable text overlay area -->
  <g transform="translate(60, 215)">
    <rect x="0" y="0" width="960" height="600" rx="32" fill="url(#cardBg)" filter="url(#cardShadow)"/>

    <!-- Editable icon area (placeholder heart+house) -->
    <g transform="translate(380, 50)">
      <circle cx="100" cy="100" r="85" fill="#E8F5EC"/>
      <path d="M 100 50 C 75 25, 35 35, 35 65 C 35 100, 100 155, 100 155 C 100 155, 165 100, 165 65 C 165 35, 125 25, 100 50 Z" fill="#FC9000"/>
      <path d="M 100 88 L 72 108 L 72 130 L 92 130 L 92 118 L 108 118 L 108 130 L 128 130 L 128 108 Z" fill="#FFFFFF"/>
    </g>

    <!-- EDITABLE HEADLINE - 2 lines max -->
    <text x="60" y="310" font-family="Montserrat, sans-serif" font-size="48" font-weight="800" fill="#1A1A2E">Headline Utama</text>
    <text x="60" y="365" font-family="Montserrat, sans-serif" font-size="48" font-weight="800" fill="#1A6B30">Disini (Maks 2 Baris)</text>

    <!-- EDITABLE Subtitle -->
    <text x="60" y="415" font-family="Inter, sans-serif" font-size="20" fill="#475569">Subtitle pendek yang menjelaskan konten</text>

    <!-- EDITABLE Bullet points -->
    <g transform="translate(60, 460)">
      <circle cx="8" cy="8" r="6" fill="#2D9C4A"/>
      <text x="28" y="13" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Point penting pertama</text>
    </g>
    <g transform="translate(60, 495)">
      <circle cx="8" cy="8" r="6" fill="#2D9C4A"/>
      <text x="28" y="13" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Point penting kedua</text>
    </g>
    <g transform="translate(60, 530)">
      <circle cx="8" cy="8" r="6" fill="#2D9C4A"/>
      <text x="28" y="13" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Point penting ketiga</text>
    </g>
    <g transform="translate(560, 460)">
      <circle cx="8" cy="8" r="6" fill="#2D9C4A"/>
      <text x="28" y="13" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Point penting keempat</text>
    </g>
    <g transform="translate(560, 495)">
      <circle cx="8" cy="8" r="6" fill="#2D9C4A"/>
      <text x="28" y="13" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Point penting kelima</text>
    </g>
    <g transform="translate(560, 530)">
      <circle cx="8" cy="8" r="6" fill="#2D9C4A"/>
      <text x="28" y="13" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Point penting keenam</text>
    </g>
  </g>

  <!-- CTA Section -->
  <g transform="translate(60, 850)">
    <rect x="0" y="0" width="960" height="120" rx="24" fill="url(#warmOrange)" filter="url(#cardShadow)"/>
    <text x="40" y="48" font-family="Montserrat, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">CTA Heading</text>
    <text x="40" y="76" font-family="Inter, sans-serif" font-size="15" fill="#FFFFFF">Subtext penjelasan singkat untuk ajakan bertindak</text>
    <text x="40" y="105" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">08811-118-911</text>

    <!-- WhatsApp icon -->
    <g transform="translate(870, 30)">
      <circle cx="40" cy="40" r="40" fill="#FFFFFF"/>
      <path d="M 40 18 C 28 18, 18 28, 18 40 C 18 46, 20 51, 24 55 L 21 65 L 31 62 C 35 64, 38 65, 40 65 C 52 65, 62 55, 62 43 C 62 31, 52 18, 40 18 Z M 50 53 C 49 54, 47 55, 45 55 C 43 55, 41 54, 39 53 C 35 51, 30 47, 27 41 C 26 39, 25 37, 27 35 C 28 34, 28 34, 29 34 C 30 34, 30 34, 31 35 L 32 38 C 32 39, 32 39, 31 40 L 30 41 C 32 44, 35 46, 38 47 L 39 46 C 40 45, 41 45, 42 46 L 44 47 C 45 47, 45 48, 44 49 Z" fill="#25D366"/>
    </g>
  </g>

  <!-- Footer hashtags -->
  <g transform="translate(60, 1010)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="14" fill="#A7E5BC">#JoyOfCare #KesehatanDiRumah #LansiaSehat</text>
    <text x="960" y="13" font-family="Inter, sans-serif" font-size="13" fill="#A7E5BC" text-anchor="end">Swipe →</text>
  </g>
</svg>