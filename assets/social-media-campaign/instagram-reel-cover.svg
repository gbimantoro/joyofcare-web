<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Instagram Reel Cover Template - JoyofCare">
  <title>Instagram Reel Cover Template — JoyofCare</title>
  <desc>Eye-catching Instagram Reel cover template 1080x1920 (9:16). Bold text overlay optimized for thumbnail visibility.</desc>

  <defs>
    <linearGradient id="heroGreenReel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9C4A"/>
      <stop offset="100%" stop-color="#1A6B30"/>
    </linearGradient>
    <linearGradient id="warmOrangeReel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#heroGreenReel)"/>

  <!-- Decorative blobs -->
  <circle cx="200" cy="300" r="350" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="900" cy="1500" r="400" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="950" cy="350" r="100" fill="#7ED957" opacity="0.4"/>
  <circle cx="150" cy="1700" r="120" fill="#FC9000" opacity="0.4"/>
  <circle cx="100" cy="1100" r="80" fill="#FC9000" opacity="0.3"/>

  <!-- Brand top -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="60" height="60" rx="30" fill="#FFFFFF"/>
    <path d="M 30 18 C 24 11, 11 11, 11 20 C 11 28, 30 42, 30 42 C 30 42, 49 28, 49 20 C 49 11, 36 11, 30 18 Z" fill="#2D9C4A"/>
    <text x="85" y="28" font-family="Montserrat, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Joy</text>
    <text x="148" y="28" font-family="Montserrat, sans-serif" font-size="28" font-weight="400" fill="#E8F5EC">of Care</text>
    <text x="85" y="52" font-family="Inter, sans-serif" font-size="15" fill="#A7E5BC">joyofcare.net</text>
  </g>

  <!-- Reel indicator -->
  <g transform="translate(800, 90)">
    <rect x="0" y="0" width="220" height="60" rx="30" fill="#FFFFFF"/>
    <!-- Reel icon -->
    <g transform="translate(20, 15)">
      <circle cx="15" cy="15" r="13" fill="none" stroke="#1A6B30" stroke-width="2.5"/>
      <circle cx="15" cy="15" r="5" fill="#1A6B30"/>
      <rect x="27" y="13" width="8" height="4" fill="#1A6B30"/>
    </g>
    <text x="140" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A6B30" text-anchor="middle">REEL 30s</text>
  </g>

  <!-- Big hook headline -->
  <g transform="translate(60, 280)" filter="url(#textShadow)">
    <text x="0" y="120" font-family="Montserrat, sans-serif" font-size="120" font-weight="800" fill="#FFFFFF">TIPS</text>
    <text x="0" y="240" font-family="Montserrat, sans-serif" font-size="120" font-weight="800" fill="#FC9000">SEHAT</text>
    <text x="0" y="360" font-family="Montserrat, sans-serif" font-size="120" font-weight="800" fill="#FFFFFF">LANSIA</text>
  </g>

  <!-- Subtitle / hook -->
  <g transform="translate(60, 720)">
    <rect x="0" y="0" width="960" height="200" rx="20" fill="#FFFFFF" opacity="0.95"/>
    <text x="40" y="60" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#1A6B30">5 Cara Merawat</text>
    <text x="40" y="105" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#1A6B30">Orang Tua di Rumah</text>
    <text x="40" y="145" font-family="Inter, sans-serif" font-size="18" fill="#475569">Panduan praktis untuk keluarga Indonesia</text>
    <text x="40" y="175" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#B85800" letter-spacing="2">SWIPE UNTUK LEBIH →</text>
  </g>

  <!-- Bottom callout box -->
  <g transform="translate(60, 970)">
    <rect x="0" y="0" width="960" height="280" rx="20" fill="rgba(255,255,255,0.08)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
    <text x="40" y="60" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#A7E5BC" letter-spacing="3">YANG AKAN KAMU PELAJARI:</text>

    <g transform="translate(40, 100)">
      <circle cx="10" cy="10" r="9" fill="#FC9000"/>
      <text x="35" y="16" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Nutrisi seimbang</text>
    </g>
    <g transform="translate(40, 145)">
      <circle cx="10" cy="10" r="9" fill="#FC9000"/>
      <text x="35" y="16" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Aktivitas ringan</text>
    </g>
    <g transform="translate(40, 190)">
      <circle cx="10" cy="10" r="9" fill="#FC9000"/>
      <text x="35" y="16" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Cek kesehatan berkala</text>
    </g>
  </g>

  <!-- CTA card -->
  <g transform="translate(60, 1300)">
    <rect x="0" y="0" width="960" height="160" rx="32" fill="url(#warmOrangeReel)"/>
    <text x="40" y="55" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Konsultasi Gratis</text>
    <text x="40" y="92" font-family="Inter, sans-serif" font-size="18" fill="#FFFFFF">WhatsApp JoyofCare untuk layanan ke rumah</text>
    <text x="40" y="135" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">08811-118-911</text>

    <!-- Big WhatsApp icon -->
    <g transform="translate(830, 30)">
      <circle cx="65" cy="65" r="65" fill="#FFFFFF"/>
      <path d="M 65 30 C 45 30, 30 45, 30 65 C 30 75, 33 84, 39 90 L 34 105 L 50 100 C 56 103, 60 105, 65 105 C 85 105, 100 90, 100 70 C 100 50, 85 30, 65 30 Z M 81 86 C 79 88, 76 90, 73 90 C 70 90, 67 88, 64 86 C 58 83, 50 76, 45 67 C 43 64, 41 60, 44 57 C 46 55, 46 55, 48 55 C 49 55, 49 55, 50 56 L 52 61 C 52 62, 52 63, 51 64 L 49 66 C 52 71, 57 75, 62 76 L 64 74 C 65 73, 67 73, 68 74 L 72 76 C 73 76, 73 77, 72 79 Z" fill="#25D366"/>
    </g>
  </g>

  <!-- Play button overlay hint -->
  <g transform="translate(60, 1480)">
    <circle cx="480" cy="100" r="100" fill="#FFFFFF" opacity="0.15"/>
    <path d="M 460 60 L 460 140 L 530 100 Z" fill="#FFFFFF"/>
  </g>

  <!-- Footer hashtags -->
  <g transform="translate(60, 1820)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="16" fill="#A7E5BC">#JoyOfCare #LansiaSehat #FisioterapiRumah</text>
  </g>
</svg>