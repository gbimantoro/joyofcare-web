<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Instagram Carousel Template Content Slide - JoyofCare">
  <title>Instagram Carousel Template — Content Slide — JoyofCare</title>
  <desc>Content slide template for Instagram carousel 1080x1350. Use for slides 2-5 with tips/content.</desc>

  <defs>
    <linearGradient id="heroGreenC2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="warmOrangeC2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC9000"/>
      <stop offset="100%" stop-color="#FFA940"/>
    </linearGradient>
    <filter id="cardShadowC2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#F8F9FA"/>

  <!-- Top accent bar -->
  <rect width="1080" height="280" fill="url(#heroGreenC2)"/>

  <!-- Brand header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#FFFFFF"/>
    <path d="M 24 14 C 19 8, 9 8, 9 16 C 9 22, 24 33, 24 33 C 24 33, 39 22, 39 16 C 39 8, 29 8, 24 14 Z" fill="#00bf63"/>
    <text x="68" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Joy</text>
    <text x="119" y="22" font-family="Montserrat, sans-serif" font-size="22" font-weight="400" fill="#E8F5EC">of Care</text>
    <text x="68" y="42" font-family="Inter, sans-serif" font-size="13" fill="#A7E5BC">joyofcare.net</text>
  </g>

  <!-- Slide indicator -->
  <g transform="translate(900, 70)">
    <rect x="0" y="0" width="120" height="44" rx="22" fill="#FFFFFF"/>
    <text x="60" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#007A3D" text-anchor="middle">SLIDE 02</text>
  </g>

  <!-- Big number -->
  <g transform="translate(60, 170)">
    <text x="0" y="80" font-family="Montserrat, sans-serif" font-size="120" font-weight="800" fill="#FFFFFF">2</text>
    <text x="120" y="50" font-family="Montserrat, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Judul Bagian</text>
    <text x="120" y="90" font-family="Inter, sans-serif" font-size="20" fill="#A7E5BC">Subheadline penjelasan section</text>
  </g>

  <!-- Main content card -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="960" height="850" rx="32" fill="#FFFFFF" filter="url(#cardShadowC2)"/>

    <!-- EDITABLE icon -->
    <g transform="translate(380, 30)">
      <circle cx="100" cy="100" r="85" fill="#E8F5EC"/>
      <!-- Editable icon placeholder -->
      <circle cx="100" cy="100" r="45" fill="#00bf63"/>
    </g>

    <!-- EDITABLE Title -->
    <text x="60" y="280" font-family="Montserrat, sans-serif" font-size="44" font-weight="800" fill="#1A1A2E">Judul Utama Konten</text>
    <text x="60" y="325" font-family="Inter, sans-serif" font-size="20" fill="#475569">Penjelasan detail tentang topik ini</text>

    <!-- EDITABLE bullet list -->
    <g transform="translate(60, 380)">
      <circle cx="10" cy="10" r="8" fill="#00bf63"/>
      <text x="40" y="16" font-family="Inter, sans-serif" font-size="19" fill="#1A1A2E">Poin pertama yang edukatif</text>
    </g>
    <g transform="translate(60, 420)">
      <circle cx="10" cy="10" r="8" fill="#00bf63"/>
      <text x="40" y="16" font-family="Inter, sans-serif" font-size="19" fill="#1A1A2E">Poin kedua yang edukatif</text>
    </g>
    <g transform="translate(60, 460)">
      <circle cx="10" cy="10" r="8" fill="#00bf63"/>
      <text x="40" y="16" font-family="Inter, sans-serif" font-size="19" fill="#1A1A2E">Poin ketiga yang edukatif</text>
    </g>

    <!-- EDITABLE highlight box -->
    <g transform="translate(60, 530)">
      <rect x="0" y="0" width="840" height="100" rx="16" fill="#FFF7ED" stroke="#FC9000" stroke-width="2"/>
      <text x="30" y="35" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#B85800">💡 PRO TIP</text>
      <text x="30" y="65" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">Highlight informasi penting di sini</text>
      <text x="30" y="88" font-family="Inter, sans-serif" font-size="17" fill="#1A1A2E">yang perlu pembaca ingat.</text>
    </g>

    <!-- EDITABLE content blocks -->
    <g transform="translate(60, 660)">
      <rect x="0" y="0" width="400" height="150" rx="14" fill="#F0FDF4"/>
      <text x="200" y="40" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#007A3D" text-anchor="middle">Stat 1</text>
      <text x="200" y="100" font-family="Montserrat, sans-serif" font-size="44" font-weight="800" fill="#007A3D" text-anchor="middle">85%</text>
      <text x="200" y="130" font-family="Inter, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Caption singkat</text>
    </g>
    <g transform="translate(500, 660)">
      <rect x="0" y="0" width="400" height="150" rx="14" fill="#F0FDF4"/>
      <text x="200" y="40" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#007A3D" text-anchor="middle">Stat 2</text>
      <text x="200" y="100" font-family="Montserrat, sans-serif" font-size="44" font-weight="800" fill="#007A3D" text-anchor="middle">24/7</text>
      <text x="200" y="130" font-family="Inter, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Caption singkat</text>
    </g>
  </g>

  <!-- CTA Footer -->
  <g transform="translate(60, 1200)">
    <rect x="0" y="0" width="960" height="100" rx="20" fill="url(#warmOrangeC2)" filter="url(#cardShadowC2)"/>
    <text x="40" y="40" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Butuh konsultasi lebih lanjut?</text>
    <text x="40" y="70" font-family="Inter, sans-serif" font-size="15" fill="#FFFFFF">Chat WhatsApp JoyofCare: 08811-118-911</text>
    <text x="920" y="55" font-family="Inter, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="end">→</text>
  </g>

  <g transform="translate(60, 1320)">
    <text x="0" y="13" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Swipe untuk tips lainnya →</text>
  </g>
</svg>