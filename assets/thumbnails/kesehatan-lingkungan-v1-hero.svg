<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad_lingkungan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#F8FCF9"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="accentGrad_lingkungan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bf63"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <filter id="softShadow_lingkungan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#007A3D" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow_lingkungan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <pattern id="gridDots_lingkungan" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#00bf63" opacity="0.18"/>
    </pattern>
    <clipPath id="photoClip_lingkungan">
      <rect x="650" y="65" width="480" height="500" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad_lingkungan)"/>
  <rect width="1200" height="630" fill="url(#gridDots_lingkungan)"/>

  <circle cx="1100" cy="100" r="220" fill="#00bf63" opacity="0.08"/>
  <circle cx="150" cy="550" r="180" fill="#FC9000" opacity="0.05"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 68)">
    <!-- Category Pill Badge -->
    <g>
      <rect x="0" y="0" width="320" height="38" rx="19" fill="#00bf63" fill-opacity="0.12"/>
      <rect x="0" y="0" width="320" height="38" rx="19" fill="none" stroke="#00bf63" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="7" fill="#00bf63"/>
      <text x="38" y="24" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#007A3D" letter-spacing="1.1">KESEHATAN LINGKUNGAN &amp; MITIGASI</text>
    </g>

    <!-- Punchy Titles -->
    <text x="0" y="102" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#0F172A" letter-spacing="-1">Kesehatan Lingkungan</text>
    <text x="0" y="160" font-family="Montserrat, Inter, sans-serif" font-size="48" font-weight="800" fill="#007A3D" letter-spacing="-1">Mitigasi Polusi, Udara &amp; Bencana</text>

    <!-- Subtitle -->
    <text x="0" y="214" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569">
      <tspan x="0" dy="0">Protokol perlindungan abu vulkanik, ISPA, kualitas air</tspan>
      <tspan x="0" dy="26">tandon, filtrasi N95, dan dokter visit langsung ke rumah.</tspan>
    </text>

    <!-- Features / Steps -->
    <g transform="translate(0, 280)">
      <g transform="translate(0, 0)">
        <circle cx="16" cy="16" r="16" fill="#00bf63" fill-opacity="0.15"/>
        <path d="M10 16 L14 20 L22 12" fill="none" stroke="#007A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Filtrasi Partikel N95 &amp; Air Purifier HEPA Rumah</text>
      </g>
      <g transform="translate(0, 48)">
        <circle cx="16" cy="16" r="16" fill="#00bf63" fill-opacity="0.15"/>
        <path d="M10 16 L14 20 L22 12" fill="none" stroke="#007A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Penanganan Cepat ISPA, Asma &amp; Bronkitis di Rumah</text>
      </g>
      <g transform="translate(0, 96)">
        <circle cx="16" cy="16" r="16" fill="#00bf63" fill-opacity="0.15"/>
        <path d="M10 16 L14 20 L22 12" fill="none" stroke="#007A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Uji Lab Kualitas Air Tandon &amp; Terapi Nebulizer Homecare</text>
      </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="310" height="48" rx="24" fill="url(#accentGrad_lingkungan)" filter="url(#badgeShadow_lingkungan)"/>
      <text x="155" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Konsultasi Kesehatan Lingkungan →</text>
    </g>
  </g>

  <!-- Right Visual Focus Card with Journalistic Photograph -->
  <g filter="url(#softShadow_lingkungan)">
    <rect x="648" y="63" width="484" height="504" rx="30" fill="#FFFFFF" stroke="#00bf63" stroke-opacity="0.2" stroke-width="2"/>
    <image href="/assets/blog/kesehatan-lingkungan.jpg" x="650" y="65" width="480" height="500" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip_lingkungan)"/>
    
    <!-- Photojournalism Overlay Badge -->
    <g transform="translate(670, 490)">
      <rect x="0" y="0" width="320" height="44" rx="22" fill="#0F172A" fill-opacity="0.85" filter="url(#badgeShadow_lingkungan)"/>
      <circle cx="22" cy="22" r="6" fill="#00bf63"/>
      <text x="38" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">DOKUMENTER FOTOJURNALISTIK MEDIS</text>
    </g>
  </g>
</svg>